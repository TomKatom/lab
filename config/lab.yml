# Single source of truth for facts shared across all IaC layers:
#   OpenTofu (infra/tofu)  ·  Ansible (ansible/)  ·  Helm/Argo (clusters/lab/)
# Non-secret. Secrets live in SOPS; tool-specific/operator facts (Proxmox
# endpoint, storage pools, VM sizing, ...) stay declared in each tool.
domain: tomkatom.com
network:
  internal_subnet: 10.10.10.0/24  # vmbr1 subnet (Tofu bridge/VM, Ansible NAT + WG route)
  vmbr1_host_address: 10.10.10.1/24  # host side of vmbr1 = the VM's gateway
  wireguard_subnet: 10.10.20.0/24  # WG peer subnet (Tofu fw mgmt, Ansible wireguard)
  wireguard_host_address: 10.10.20.1/24  # host side of wg0 (Ansible wireguard role)
  # --- wg1, the guest exit VPN --------------------------------------------
  # A second WireGuard tunnel whose clients take 0.0.0.0/0, ::/0 — a full
  # tunnel, so a guest's traffic egresses from this server's German IP.
  # Deliberately its own interface rather than a second subnet carved out of
  # wireguard_subnet above, for two things a subnet split cannot give: the
  # isolation rules (ansible/roles/network_nat) match on `iifname "wg1"`,
  # which stays correct even if a peer address is assigned wrongly, and wg1
  # carries its own server keypair, so a leaked guest config reveals nothing
  # about the management tunnel.
  #
  # THE EXIT SUBNET MUST NEVER ENTER THE MANAGEMENT PATH. It is absent from
  # infra/tofu/locals.tf's `management_sources` by construction, and
  # infra/tofu/firewall.tf carries a lifecycle precondition that fails the
  # apply if it ever appears there: inside the `+mgmt` ipset it would hand
  # every guest host SSH, the Proxmox API and PBS — the exact opposite of
  # what this tunnel is for. It is left out of hardening_fail2ban_ignoreip
  # (ansible/roles/hardening) for the same reason.
  wireguard_exit_subnet: 10.10.30.0/24  # wg1 peer subnet (Ansible wireguard + egress masquerade; Tofu asserts it is never a mgmt source)
  wireguard_exit_host_address: 10.10.30.1/24  # host side of wg1 (Ansible wireguard role)
  # The ULA half of wg1 closes a failure mode that is silent rather than
  # loud: on an IPv4-only tunnel a client whose carrier has IPv6 (Israeli
  # carriers increasingly do) keeps routing every IPv6-capable destination —
  # Google, Cloudflare, Netflix — outside the tunnel over its local address,
  # so geolocation still reads the client's own country and the feature
  # looks like it works while doing nothing. Giving wg1 a v6 address is what
  # lets a peer put `::/0` in AllowedIPs and capture that traffic. The host
  # masquerades IPv4 only and forwards no IPv6, so `::/0` is a deterministic
  # blackhole and every connection falls back to IPv4 through Germany. That
  # blackhole is enforced twice by ansible/roles/network_nat, not inherited
  # from a kernel default: it pins net.ipv6.conf.all.forwarding to 0, and its
  # ruleset carries an ip6 table dropping both directions across wg1 in case
  # anything ever flips that knob. Real IPv6 egress is out of scope here —
  # see docs/networking.md for what it would cost.
  #
  # RFC 4193 asks for a random 40-bit global ID; this uses the all-zero one,
  # as Docker and a lot of CPEs do. That is a collision risk only for a
  # destination reachable *outside* the tunnel, and with `::/0` in AllowedIPs
  # there is none — but renumber to a random prefix before wg1 ever carries
  # real IPv6 egress.
  wireguard_exit_subnet_v6: fd00:10:30::/64  # wg1 ULA peer prefix — peers take a /128 out of it (Ansible wireguard)
  wireguard_exit_host_address_v6: fd00:10:30::1/64  # host side of wg1's ULA (Ansible wireguard role)
  vm_ip_address: 10.10.10.10  # k3s-node static internal IP (Tofu cloud-init, Ansible DNAT)
  runner_address: 10.10.10.20  # self-hosted GitHub Actions runner VM static internal IP (Tofu cloud-init)
# Management endpoints addressable by name instead of by hardcoded internal
# IP — `ssh pve.lab.tomkatom.com`, `https://pve.lab.tomkatom.com:8006`.
# Consumed by Tofu (infra/tofu/cloudflare.tf) as grey-cloud A records whose
# targets are the RFC1918 addresses declared above, so the names resolve for
# anyone but only *answer* over WireGuard or from vmbr1. Naming these is also
# what makes a real TLS cert possible later — an IP literal can never hold
# one.
#
# The dedicated `lab.` label keeps them clear of `*.domain` (a wildcard
# matches exactly one label) and of external-dns' per-service records.
# `address` is a key into `network:` above, never a raw IP, so renumbering a
# host stays a one-line edit there.
management_subdomain: lab
management_hosts:
  - name: pve  # Proxmox host — SSH + UI/API, via its vmbr1 address
    address: vmbr1_host_address
  - name: k3s  # k3s-node VM — SSH + k8s API
    address: vm_ip_address
  - name: runner  # self-hosted CI runner VM — SSH
    address: runner_address
ports:  # Tofu filter fw · Ansible nftables NAT/DNAT · Helm svc ports
  https: 443
  plex: 32400
  torrent: 51413
  ssh: 22
  wireguard: 51820
  # wg1's endpoint (network.wireguard_exit_subnet above). Public for the
  # same reason `wireguard` is — a tunnel endpoint has to be reachable to be
  # useful — and public on its own port rather than sharing 51820, because
  # one UDP port serves exactly one WireGuard interface. Opening it grants no
  # lab access by itself: without a peer key nothing connects, and a
  # connected guest is firewalled away from every internal address.
  wireguard_exit: 51821
  pve_api: 8006
  k8s_api: 6443
  # PVE host metrics (ansible/roles/node_exporter). Management-only: it
  # belongs in Tofu's node_mgmt_rules, never in nat_ingress_rules below —
  # a DNAT entry here would publish the host's disks, filesystems and
  # process inventory to the internet.
  node_exporter: 9100
  # Proxmox Backup Server UI/API (ansible/roles/pbs). Management-only,
  # under the same rule as node_exporter above and for a stronger reason:
  # this port fronts every backup the server has, so a DNAT entry in
  # nat_ingress_rules would put the recovery path itself on the public
  # internet behind one login form.
  pbs_api: 8007
# Proxmox Backup Server facts that cross layers. `storage_id` is the PVE
# storage entry ansible/roles/pbs registers the datastore as, and the one
# infra/tofu/backup.tf points the nightly vzdump job at. It lives here
# because a mismatch between those two is not caught anywhere: PVE accepts a
# backup job naming a storage that does not exist and simply fails every
# night at 04:00. The datastore name itself stays in roles/pbs — only PBS
# ever sees it.
pbs:
  storage_id: pbs
# Host-inbound port forwards. Single source of truth for both Tofu's host
# firewall accept rules (infra/tofu/locals.tf public_service_rules) and
# Ansible's DNAT rules (ansible/roles/network_nat) — add/change a forward
# here once and both layers pick it up. `port`/`destination` are keys into
# `ports`/`network` above, never raw numbers/IPs, so a port renumber or a
# destination change (e.g. splitting services across VMs) is one edit.
nat_ingress_rules:
  - comment: HTTPS
    proto: tcp
    port: https
    destination: vm_ip_address
  - comment: Plex
    proto: tcp
    port: plex
    destination: vm_ip_address
  - comment: Torrent TCP
    proto: tcp
    port: torrent
    destination: vm_ip_address
  - comment: Torrent UDP
    proto: udp
    port: torrent
    destination: vm_ip_address
# SSH public keys authorized for admin/automation access — public halves
# only, always safe to commit; the matching private keys never enter git
# (personal keys stay in a password manager/agent, the automation key's
# private half lives only as the GitHub Actions secret
# PROXMOX_SSH_PRIVATE_KEY — see docs/ssh-keys.md for the full custody
# model). Consumed today by Tofu (VM cloud-init, infra/tofu/vm-k3s.tf);
# Ansible's `hardening` role reads the same list for the Proxmox host once
# Phase 3 lands. Add a key here once (password-manager or hardware-backed,
# not tied to one laptop) rather than re-authorizing per machine.
admin_ssh_public_keys:
  # Legacy — a bare file on TOM-PC only. Remove once the host and VM are
  # both confirmed reachable via tom-admin below (see docs/ssh-keys.md).
  - "ssh-rsa  katom@TOM-PC"
  # Password-manager-backed (Bitwarden SSH agent) — not tied to one device.
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINYKFAMFWxDIsq8vAH6+Z2eYhlpQwsmdxou7SE0ofMiy tom-admin"
  # Automation key (`ci-tofu-apply`, GitHub secret PROXMOX_SSH_PRIVATE_KEY) —
  # not a personal key, added here deliberately: CI-driven Ansible applies
  # (ansible-apply.yml) need to reach the VMs too, not just the Proxmox host.
  # The `hardening` role reconciles this list onto the host's and guests'
  # authorized_keys, so the key lands on k3s-node even though the VM predates
  # it and cloud-init only seeds keys at first boot (see docs/ssh-keys.md).
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPIIYo8m5KqAITkQohEFdpXdsE5BvZKKn+QE9dGxrqde github-actions-tofu-apply"
