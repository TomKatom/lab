# ksops generator: decrypts the SOPS file below into a real Secret at render
# time, inside the repo-server. Never a resource in its own right — kustomize
# consumes and drops it.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: finance-common-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - moneyman-config.sops.yaml
