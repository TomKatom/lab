# Homepage — the front door at the apex, `tomkatom.com`. One page aimed at
# the people who watch the library: Plex, the request portal, and enough
# help to get a device set up. Not an operator dashboard; the admin UIs
# stay behind Authelia on their own hostnames and are not named here or in
# the page itself. ./homepage/configmap-homepage.yaml carries the content
# and the reasoning behind what is on it.
#
# Wave 2, one wave after ./homepage-config.yaml, so the homepage-config
# ConfigMap it mounts already exists when the first Pod starts (see
# ./README.md "Sync waves within apps/").
#
# It never mounts /data (./README.md "The /data mount") and, since the *arr
# widgets left with the *arr tiles, it no longer reads a Secret or a
# cluster-internal address either — there is not one `HOMEPAGE_VAR_*` left
# in this file.
#
# ## The apex, and the two things that follow from it
#
# The host below is `tomkatom.com` itself, not a `home.` subdomain. That is
# the address a viewer can be told once and remember, and it is already the
# name this cluster answers on: `docs/runbooks/dns-cutover.md` §5 points the
# apex A record at the node in flip 1, one flip before external-dns starts
# publishing per-Ingress records at all. So this page is live from the first
# cutover step rather than the last. Nothing else in the stack wants the
# apex, and `home.tomkatom.com` has never resolved, so there is no
# redirect-from-the-old-name to keep.
#
# 1. **The apex is not covered by the wildcard.** `*.tomkatom.com` matches
#    one label and no fewer, so `tomkatom.com` needs its own SAN —
#    `clusters/lab/platform/traefik/wildcard-certificate.yaml` now lists
#    both names on the one Certificate that Traefik's default TLSStore
#    serves. Drop that SAN and this host answers on Traefik's self-signed
#    default with a browser warning in front of it.
# 2. **external-dns will not create the apex record, and must not.** It is
#    Tofu's (`infra/tofu/cloudflare.tf`, `local.dns_a_records`), carries no
#    ownership TXT, and external-dns declines a Create at any name already
#    holding a record it does not own. The apex record this Ingress needs is
#    one Tofu already manages.
#
# ## `www`, the one name that is not the apex
#
# `www.tomkatom.com` is served here too, as a second host on the same
# Ingress rather than a redirect: the page asks crawlers not to index it
# (`disableIndexing`), so there is no canonical-URL reason to prefer one
# name, and a second host is a line of YAML where a redirect would be a
# Middleware to write and keep. It is also the one name a viewer typing
# from memory is most likely to reach for.
#
# Unlike the apex it needs nothing from Tofu — the wildcard SAN already
# covers it and external-dns creates and owns its A record at flip 2. What
# it does need is the old server's `www` CNAME gone first: while that
# unowned record sits at the name, external-dns declines the Create and
# says nothing about it. `docs/runbooks/dns-cutover.md` §6a deletes it
# alongside the other suppressing names, which is why this host can be
# merged before the cutover without waiting on anything.
#
# ⚠ A config edit needs `kubectl -n media rollout restart deploy/homepage`
# to take effect, and Argo reports the Application synced either way. The
# files are mounted with subPath, which Kubernetes never updates in place,
# so an Argo sync updates the ConfigMap object while the running Pod keeps
# serving the files already projected into it.
#
# This is a chosen trade, not a chart limitation: app-template renders
# ConfigMaps declared under `configMaps:` in its own values and stamps a
# `checksum/configMaps` pod annotation over their data
# (`charts/common/templates/lib/pod/metadata/_annotations.tpl`), which
# rolls the Deployment on every content change. That only covers
# chart-owned ConfigMaps, so taking it would mean folding all 332 lines of
# ./homepage/configmap-homepage.yaml — nine files, custom.css and custom.js
# among them — into this Application's valuesObject, past `tpl`, and out of
# the kustomize build CI actually validates. The separate `-config`
# Application keeps that (./README.md "Kustomize `-config` dirs"); the
# manual restart is what it costs. Revisit if the config starts changing
# often enough that the drift window matters more than the validation.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 5.0.1
    helm:
      valuesObject:
        # app-template 5.x splits identity across two levels: the pod-level
        # PodSecurityContext (no `capabilities` field) here, and the
        # container-level SecurityContext (has `capabilities`, no `fsGroup`)
        # under controllers.app.containers.app below. See ./README.md
        # "Identity: everything runs as 1000:1000".
        #
        # The image declares `USER root` and its entrypoint drops privilege
        # with su-exec when PUID is set — but its final branch is
        # `exec "$@"` when it is already not root, which is exactly the case
        # Kubernetes creates here. Everything the app owns is copied
        # `--chown=1000:1000`, and upstream's own Kubernetes install docs
        # ship this same 1000:1000 / runAsNonRoot / drop-ALL block, so no
        # LSIO-style exception is needed. PUID/PGID are deliberately unset:
        # setting them would only ask a non-root process to chown paths it
        # already owns.
        defaultPodOptions:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        controllers:
          app:
            containers:
              app:
                image:
                  repository: ghcr.io/gethomepage/homepage
                  # renovate: datasource=docker depName=ghcr.io/gethomepage/homepage
                  tag: "v1.13.2@sha256:a0b71c8e757298d02560186bab9fbe3fc2d375c523a62cc1019177b37e48aa28"
                securityContext:
                  capabilities:
                    drop: ["ALL"]
                # A list, not a map, because the order matters: Kubernetes
                # expands $(VAR) only against variables declared earlier in
                # the same list, and a map would be emitted in key order,
                # putting HOMEPAGE_ALLOWED_HOSTS before MY_POD_IP.
                env:
                  - name: MY_POD_IP
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
                  # Required since homepage v1.0: src/middleware.js rejects
                  # any request to /api/* whose Host header is not in this
                  # list, with a 400. Two entries are needed, both of them
                  # load-bearing:
                  #
                  #   <pod IP>:3000 — the kubelet's HTTP probes below are
                  #   addressed to the Pod IP, so that is the Host header
                  #   they carry, and /api/healthcheck is under the
                  #   middleware's `/api/:path*` matcher. Without this the
                  #   probes get 400 and the Pod never goes ready. This is
                  #   the exact form upstream's own Kubernetes install docs
                  #   use, for the same reason.
                  #
                  #   tomkatom.com and www.tomkatom.com — what Traefik
                  #   forwards from the browser. Both Ingress hosts have to
                  #   be listed: the middleware matches the Host header
                  #   verbatim, so a name missing here still renders the
                  #   page and 400s every /api/* call behind it.
                  - name: HOMEPAGE_ALLOWED_HOSTS
                    value: "$(MY_POD_IP):3000,tomkatom.com,www.tomkatom.com"
                envFrom:
                  - configMapRef:
                      name: media-env
                probes:
                  # /api/healthcheck is the route the image's own HEALTHCHECK
                  # uses; the handler is a two-line `res.send("up")` with no
                  # auth of any kind (homepage has no login). It does pass
                  # through the host-validation middleware, which is why the
                  # Pod IP is in HOMEPAGE_ALLOWED_HOSTS above.
                  liveness:
                    enabled: true
                    type: HTTP
                    path: /api/healthcheck
                    port: 3000
                  readiness:
                    enabled: true
                    type: HTTP
                    path: /api/healthcheck
                    port: 3000
                  startup:
                    enabled: true
                    type: HTTP
                    path: /api/healthcheck
                    port: 3000
                # Renders a single page and proxies a handful of small API
                # calls per refresh. The floor is Node's own heap.
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    cpu: "1"
                    memory: 512Mi
        service:
          # Exactly one Service, so app-template names it `homepage` after
          # the release rather than appending the identifier. Nothing else in
          # the stack calls it, so there is no media-urls entry to keep in
          # step; see ./README.md "A Service's name depends on how many
          # Services its app declares".
          app:
            controller: app
            type: ClusterIP
            ports:
              http:
                port: 3000
        ingress:
          # No forward-auth annotation, and that is the point of the page:
          # the viewers it is for authenticate to Plex and to Seerr with a
          # Plex account and hold no Authelia identity at all, so putting
          # Authelia in front would lock out everyone it is written for.
          # This is the second of exactly two un-annotated Ingresses in the
          # stack, ./seerr.yaml being the first — see ./README.md
          # "Ingress: chart-rendered, not a `-config` dir". Traefik never
          # consults the middleware for a host that does not ask for it.
          #
          # What that costs is bounded by the content, not by the setting:
          # the page holds public hostnames and public plex.tv links, reads
          # no Secret, polls no app, and asks crawlers not to index it
          # (`disableIndexing`, ./homepage/configmap-homepage.yaml). Adding
          # anything here that a stranger should not read means adding the
          # annotation back in the same commit — at which point it is no
          # longer this page.
          app:
            hosts:
              - host: tomkatom.com
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      identifier: app
                      port: http
              - host: www.tomkatom.com
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      identifier: app
                      port: http
        persistence:
          # File-by-file rather than one directory mount, so /app/config
          # itself stays a real (if unwritable) directory that the emptyDir
          # below can be mounted inside. Every file homepage can ask for is
          # here — a missing one is fatal, not degrading; the reasoning is on
          # ./homepage/configmap-homepage.yaml.
          config:
            type: configMap
            name: homepage-config
            globalMounts:
              - path: /app/config/settings.yaml
                subPath: settings.yaml
                readOnly: true
              - path: /app/config/services.yaml
                subPath: services.yaml
                readOnly: true
              - path: /app/config/widgets.yaml
                subPath: widgets.yaml
                readOnly: true
              - path: /app/config/bookmarks.yaml
                subPath: bookmarks.yaml
                readOnly: true
              - path: /app/config/docker.yaml
                subPath: docker.yaml
                readOnly: true
              - path: /app/config/kubernetes.yaml
                subPath: kubernetes.yaml
                readOnly: true
              - path: /app/config/proxmox.yaml
                subPath: proxmox.yaml
                readOnly: true
              - path: /app/config/custom.css
                subPath: custom.css
                readOnly: true
              - path: /app/config/custom.js
                subPath: custom.js
                readOnly: true
          # The one writable path homepage needs: its file logger writes
          # ${CONF_DIR}/logs/homepage.log unconditionally (src/utils/
          # logger.js), and the rest of /app/config is read-only mounts.
          # emptyDir, not a PVC — the console transport carries the same
          # lines, so nothing here is worth keeping across a restart.
          logs:
            type: emptyDir
            globalMounts:
              - path: /app/config/logs
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
