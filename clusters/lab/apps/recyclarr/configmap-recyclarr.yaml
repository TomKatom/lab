# Recyclarr's whole configuration, mounted read-only at
# /config/recyclarr.yml by ../recyclarr.yaml (wave 2, one wave after this
# overlay's own Application) — see ../README.md "Kustomize `-config` dirs".
#
# Neither address nor credential is inlined: `!env_var NAME` reads the
# process environment, and the CronJob's container fills those four names
# from media-common's `media-urls` ConfigMap and `arr-api-keys` Secret. The
# tag is real in the pinned image — recyclarr 8.7.0 registers
# `.WithTagMapping("!env_var", typeof(EnvironmentVariableTag))`
# (Recyclarr.Core/Config/EnvironmentVariables/EnvironmentVariablesYamlBehavior.cs)
# and fails the run with EnvironmentVariableNotDefinedException if the
# variable is unset, so a missing binding is loud, not silent.
#
# Why the profiles are spelled out here rather than pulled in with
# `include: - template: <id>`: recyclarr 8.x resolves template includes
# against `includes.json` on the `v8` branch of recyclarr/config-templates
# (ConfigTemplatesStrategy.DefaultReferences is ["v8", "master", "main"],
# first match wins), and that file is `{"radarr": [], "sonarr": []}` on
# `v8` — the include ids that exist on `master` (radarr-custom-formats-*,
# sonarr-v4-*) are unreachable from this version. v8 ships whole configs
# instead, so this mirrors the two official ones for HD-1080p:
# sonarr/templates/web-1080p.yml and radarr/templates/hd-bluray-web.yml.
#
# Custom formats arrive two ways, and only one of them is automatic. A
# guide-backed quality profile auto-syncs every CF group the guide marks
# `default` (ConfiguredCustomFormatProvider.FromDefaultGroups) — those
# need no mention here, which is why there is no `skip:` block. The
# `add:` groups below are the opposite case: opt-in groups that the
# upstream templates nevertheless ship *uncommented*, so leaving them out
# would silently drop them. [Unwanted] Unwanted Formats is the one that
# matters most — it carries the negative scores that keep BR-DISK, LQ and
# upscaled releases from being grabbed at all.
#
# Both blocks mirror the upstream templates entry for entry: same group
# trash_ids, same `select:` sets, and the entries upstream leaves
# commented out (No-RlsGroup, Obfuscated, Retags, Scene) stay out here
# too. The trailing `# name` comments are upstream's and are kept so the
# ids are reviewable.
apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  namespace: media
data:
  recyclarr.yml: |
    # yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
    sonarr:
      sonarr:
        base_url: !env_var SONARR_URL
        api_key: !env_var SONARR_API_KEY

        quality_definition:
          type: series

        # TRaSH Guides "WEB-1080p", trash_id read from
        # docs/json/sonarr/quality-profiles/web-1080p.json in
        # TRaSH-Guides/Guides, the repo recyclarr itself clones.
        quality_profiles:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1
            reset_unmatched_scores:
              enabled: true

        custom_format_groups:
          add:
            - trash_id: 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD
              select:
                - 47435ece6b99a0b477caf360e79ba0bb  # x265 (HD)
            - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
              select:
                - 218e93e5702f44a68ad9e3c6ba87d2f0  # HD Streaming Boost
                - 43b3cf48cb385cd3eac608ee6bca7f09  # UHD Streaming Boost
            - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
              select:
                - 15a05bc7c1a36e2b57fd628f8977e2fc  # AV1
                - 32b367365729d530ca1c124a0b180c64  # Bad Dual Groups
                - 85c61753df5da1fb2aab6f2a47426b09  # BR-DISK
                - 6f808933a71bd9666531610cb8c059cc  # BR-DISK (BTN)
                - fbcb31d8dabd2a319072b84fc0b7249c  # Extras
                - 9c11cd3f07101cdba90a2d81cf0e56b4  # LQ
                - e2315f990da2e2cbfc9fa5b7a6fcfe48  # LQ (Release Title)
                - 23297a736ca77c0fc8e70f8edd7ee56c  # Upscaled

    radarr:
      radarr:
        base_url: !env_var RADARR_URL
        api_key: !env_var RADARR_API_KEY

        quality_definition:
          type: movie

        # TRaSH Guides "HD Bluray + WEB" — Radarr's 1080p counterpart to
        # Sonarr's WEB-1080p above, trash_id read from
        # docs/json/radarr/quality-profiles/hd-bluray-web.json.
        quality_profiles:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9
            reset_unmatched_scores:
              enabled: true

        custom_format_groups:
          add:
            - trash_id: f8bf8eab4617f12dfdbd16303d8da245  # [Optional] Golden Rule HD
              select:
                - dc98083864ea246d05a42df0d05f81cc  # x265 (HD)
            - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats
              select:
                - b8cd450cbfa689c0259a01d9e29ba3d6  # 3D
                - cae4ca30163749b891686f95532519bd  # AV1
                - b6832f586342ef70d9c128d40c07b872  # Bad Dual Groups
                - cc444569854e9de0b084ab2b8b1532b2  # Black and White Editions
                - ed38b889b31be83fda192888e2286d83  # BR-DISK
                - 0a3f082873eb454bde444150b70253cc  # Extras
                - e6886871085226c3da1830830146846c  # Generated Dynamic HDR
                - 90a6f9a284dff5103f6346090e6280c8  # LQ
                - e204b80c87be9497a8a6eaff48f72905  # LQ (Release Title)
                - 712d74cd88bceb883ee32f773656b1f5  # Sing-Along Versions
                - bfd8eb01832d646a0a89c4deb46f8564  # Upscaled
