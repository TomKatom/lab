# Tautulli — Plex watch-history and statistics, plus the Telegram
# "recently added" digest. Wave 1: after media-common (wave 0) has created
# the namespace and the media-env ConfigMap this consumes.
#
# Talks to Plex over the API only, and touches no files — no /data mount of
# any kind (see ./README.md "The /data mount").
#
# The Plex connection is declared here, in `env` below, rather than walked
# through the setup wizard: Tautulli takes `TAUTULLI_<SETTING>` overrides
# for any config.ini setting and will not let the UI save over one. What
# stays in the UI is what Tautulli keeps in its database instead of
# config.ini — notification agents and newsletters, so the Telegram digest
# is still a checklist step in docs/runbooks/media-migration.md §9.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tautulli
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 5.0.1
    helm:
      valuesObject:
        # app-template 5.x splits identity across two levels: the pod-level
        # PodSecurityContext (no `capabilities` field) here, and the
        # container-level SecurityContext (has `capabilities`, no `fsGroup`)
        # under controllers.app.containers.app below. See ./README.md
        # "Identity: everything runs as 1000:1000". The home-operations
        # image is confirmed rootless at this exact pinned digest (its
        # image config declares `User: nobody:nogroup`), so no per-app
        # exception is needed the way Deluge's LSIO image requires one.
        defaultPodOptions:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        controllers:
          app:
            containers:
              app:
                image:
                  repository: ghcr.io/home-operations/tautulli
                  # renovate: datasource=docker depName=ghcr.io/home-operations/tautulli
                  tag: "2.17.2@sha256:7592e192e2dd5297054a80c0f1e8b2593f7675af75c5020806b30c712e159406"
                securityContext:
                  capabilities:
                    drop: ["ALL"]
                envFrom:
                  - configMapRef:
                      name: media-env
                # Tautulli reads `TAUTULLI_<SETTING>` ahead of config.ini for
                # every setting it has, and refuses to write that setting back
                # from the UI while the variable is set — `get_setting` checks
                # the environment first and `set_setting` returns early with
                # "set by environment variable. Setting not saved to config."
                # (plexpy/config.py at this pinned tag). That is the same
                # git-wins contract the *arrs get from `SONARR__AUTH__APIKEY`,
                # so the Plex connection belongs here rather than in a setup
                # wizard somebody has to remember to re-run after the config
                # PVC is lost. Everything Tautulli owns — its history
                # database, its notification agents — still lives in the PVC;
                # only the settings named below are pinned.
                env:
                  - name: TAUTULLI_PMS_IP
                    valueFrom:
                      configMapKeyRef:
                        name: media-urls
                        key: PLEX_HOST
                  - name: TAUTULLI_PMS_PORT
                    valueFrom:
                      configMapKeyRef:
                        name: media-urls
                        key: PLEX_PORT
                  # Plain HTTP inside the cluster; both ends are on the pod
                  # network. This also decides `pms_url`, which Tautulli
                  # derives as http://<PMS_IP>:<PMS_PORT> whenever SSL is off
                  # (plexpy/plextv.py `get_server_resources`) — so there is no
                  # separate URL setting to keep in step with the two above.
                  - name: TAUTULLI_PMS_SSL
                    value: "0"
                  # Plex's machineIdentifier, read off the running server with
                  # `curl -s http://10.10.10.10:32400/identity`. Tautulli
                  # treats this as an input and never discovers it for itself:
                  # `get_server_resources` passes CONFIG.PMS_IDENTIFIER into
                  # `get_server_connections`, which logs "no pms_identifier
                  # provided" and returns nothing when it is empty. Not a
                  # secret — it is the same identifier plex.tv hands to every
                  # client it brokers.
                  - name: TAUTULLI_PMS_IDENTIFIER
                    value: "078e68e829013377bfc40670acad0ad24d4eb604"
                  - name: TAUTULLI_PMS_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: tautulli-credentials
                        key: PLEX_TOKEN
                  - name: TAUTULLI_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: tautulli-credentials
                        key: TAUTULLI_API_KEY
                  # Skips the first-run wizard outright. The wizard exists to
                  # collect exactly the connection declared above, so leaving
                  # it armed would mean a fresh pod serving a setup page that
                  # cannot tell it anything it does not already have.
                  - name: TAUTULLI_FIRST_RUN_COMPLETE
                    value: "1"
                probes:
                  # /status is anonymous in Tautulli's own source at this
                  # exact pinned tag (v2.17.2): webstart.py turns
                  # `tools.auth_basic` off for the `/status` branch, and
                  # webserve.py's `status()` handler carries no
                  # `@requireAuth()` decorator — which is the only thing
                  # that puts `auth.require` in the request config and so
                  # the only thing webauth.check_auth acts on. Safe to
                  # probe regardless of whether the restored config has
                  # Tautulli's own login enabled.
                  liveness:
                    enabled: true
                    type: HTTP
                    path: /status
                    port: 8181
                  readiness:
                    enabled: true
                    type: HTTP
                    path: /status
                    port: 8181
                  startup:
                    enabled: true
                    type: HTTP
                    path: /status
                    port: 8181
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: "1"
                    memory: 1Gi
        service:
          app:
            controller: app
            type: ClusterIP
            ports:
              http:
                port: 8181
        ingress:
          app:
            annotations:
              traefik.ingress.kubernetes.io/router.middlewares: authelia-forwardauth@kubernetescrd
            hosts:
              - host: tautulli.tomkatom.com
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      identifier: app
                      port: http
        persistence:
          config:
            type: persistentVolumeClaim
            accessMode: ReadWriteOnce
            size: 5Gi
            globalMounts:
              - path: /config
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
