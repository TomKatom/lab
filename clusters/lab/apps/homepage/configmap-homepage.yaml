# Homepage's entire configuration, mounted file-by-file over /app/config by
# ../homepage.yaml (wave 2, one wave after this overlay's own Application) —
# see ../README.md "Kustomize `-config` dirs".
#
# ## Every file homepage can ask for has to be here
#
# checkAndCopyConfig (src/utils/config/config.js at the pinned v1.13.2) copies
# a missing config file out of the image's skeleton and calls
# `process.exit(1)` when that copy fails. /app/config in the Pod is a
# kubelet-created directory holding read-only subPath mounts, so the copy can
# never succeed — which means a file homepage looks for and does not find
# kills the process rather than degrading. The full set it can ask for is
# settings/services/widgets/bookmarks/docker/kubernetes/proxmox.yaml
# (/api/validate reads six of them, including proxmox.yaml, on every page
# load) plus custom.css and custom.js (/api/hash). All nine are declared
# below, including the ones that are deliberately empty.
#
# ## No cluster-internal address is written here
#
# Every widget URL is `{{HOMEPAGE_VAR_<APP>_URL}}` and every widget key is
# `{{HOMEPAGE_VAR_<APP>_API_KEY}}`; substituteEnvironmentVars replaces both
# from the process environment before js-yaml ever parses the file, and
# ../homepage.yaml fills those names from media-common's `media-urls`
# ConfigMap and `arr-api-keys` Secret. No cluster-internal Service address
# is spelled out anywhere in this directory — see ../README.md "Secrets and
# environment".
#
# The `href:` values are the opposite case: they are what the browser
# navigates to, so they are the public hostnames from each app's own Ingress,
# not the cluster-internal Service addresses.
#
# ## Only the four *arrs get a live widget
#
# A homepage widget authenticates with the credential of the app it polls.
# `arr-api-keys` holds exactly four — Sonarr, Radarr, Prowlarr, Bazarr — so
# those four render live counters. Deluge's WebUI password, Plex's token,
# Tautulli's and Overseerr's API keys all live inside each app's own migrated
# database rather than in git (docs/runbooks/media-migration.md §9), so those
# tiles are links only. Adding a widget for one of them later means adding
# its credential to a Secret in media-common and binding it here as another
# HOMEPAGE_VAR_*; the address half is already available in `media-urls`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: media
data:
  settings.yaml: |
    ---
    title: tomkatom
    headerStyle: boxed
    theme: dark
    color: slate
    # Keyed by the group names in services.yaml below; homepage matches
    # them by name, so the two lists have to be renamed together.
    layout:
      Requests:
        style: row
        columns: 1
      Library:
        style: row
        columns: 3
      Acquisition:
        style: row
        columns: 5

  services.yaml: |
    ---
    - Requests:
        - Overseerr:
            icon: overseerr.png
            href: https://requests.tomkatom.com
            description: Request portal, signed in with Plex

    - Library:
        - Plex:
            icon: plex.png
            href: https://app.plex.tv
            description: Streaming — brokered by plex.tv, no local hostname
        - Tautulli:
            icon: tautulli.png
            href: https://tautulli.tomkatom.com
            description: Watch history and statistics
        - Maintainerr:
            icon: maintainerr.png
            href: https://maintainerr.tomkatom.com
            description: Library retention rules

    - Acquisition:
        - Sonarr:
            icon: sonarr.png
            href: https://sonarr.tomkatom.com
            description: TV
            widget:
              type: sonarr
              url: "{{HOMEPAGE_VAR_SONARR_URL}}"
              key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
              enableQueue: true
        - Radarr:
            icon: radarr.png
            href: https://radarr.tomkatom.com
            description: Movies
            widget:
              type: radarr
              url: "{{HOMEPAGE_VAR_RADARR_URL}}"
              key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
              enableQueue: true
        - Prowlarr:
            icon: prowlarr.png
            href: https://prowlarr.tomkatom.com
            description: Indexers
            widget:
              type: prowlarr
              url: "{{HOMEPAGE_VAR_PROWLARR_URL}}"
              key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"
        - Bazarr:
            icon: bazarr.png
            href: https://bazarr.tomkatom.com
            description: Subtitles
            widget:
              type: bazarr
              url: "{{HOMEPAGE_VAR_BAZARR_URL}}"
              key: "{{HOMEPAGE_VAR_BAZARR_API_KEY}}"
        - Deluge:
            icon: deluge.png
            href: https://deluge.tomkatom.com
            description: Downloads and seeding

  widgets.yaml: |
    ---
    # Reads the node's own CPU and memory through systeminformation. No
    # `disk:` entry: homepage never mounts /data (../README.md "The /data
    # mount"), so the only filesystem it could report on is its own
    # container root, which measures nothing anyone cares about.
    - resources:
        cpu: true
        memory: true

    - search:
        provider: duckduckgo
        target: _blank

  bookmarks.yaml: |
    ---
    - Reference:
        - TRaSH Guides:
            - abbr: TR
              href: https://trash-guides.info/
        - Servarr Wiki:
            - abbr: SW
              href: https://wiki.servarr.com/

  # Container discovery, off. Homepage would read a Docker socket to
  # auto-discover services; there is no Docker here (k3s runs containerd) and
  # mounting a container runtime socket into a web dashboard behind a single
  # reverse proxy is not a trade worth making. The file exists only because
  # /api/validate and /api/hash both read it.
  docker.yaml: |
    ---
    # No Docker hosts configured.

  # Kubernetes discovery, off. With no `mode:` key getKubeConfig returns null
  # (src/utils/config/kubernetes.js) and homepage never contacts the API
  # server, so its ServiceAccount needs no RBAC at all. Turning this on would
  # mean granting read access to Ingresses cluster-wide; the services.yaml
  # above is explicit instead.
  kubernetes.yaml: |
    ---
    # No `mode:` key, so discovery stays off.

  # Proxmox stats, off. Reachable in principle (the host is 10.10.10.1) but
  # it would need an API token in git, and node metrics belong to Phase 7's
  # observability work, not to a link dashboard. Declared because
  # /api/validate reads proxmox.yaml on every page load and a missing file
  # exits the process.
  proxmox.yaml: |
    ---
    # No Proxmox nodes configured.

  # Read by /api/hash on every page load. Empty, but they must exist.
  custom.css: ""
  custom.js: ""
