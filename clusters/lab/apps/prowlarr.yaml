# Prowlarr — indexer manager for the *arr stack. Talks to Sonarr/Radarr's
# APIs to keep their indexer lists in sync; never touches `/data` (see
# ./README.md "The /data mount"), so no persistence beyond its own /config.
#
# Wave 1, same as every other app chart here — depends only on media-common
# (wave 0) for the `arr-api-keys` Secret and `media-env` ConfigMap.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prowlarr
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 5.0.1
    helm:
      valuesObject:
        controllers:
          main:
            containers:
              main:
                image:
                  repository: ghcr.io/home-operations/prowlarr
                  # renovate: datasource=docker depName=ghcr.io/home-operations/prowlarr
                  tag: "2.6.0.5494@sha256:f2db7fc93c2c26476de74695b565bfced0f39255cdba30fedf6d1ec45789f818"
                env:
                  # Servarr's env-override scheme is <APP>__<Section>__<Key>,
                  # matching config.xml's <Auth><Method>/<Auth><ApiKey>
                  # elements one-for-one — confirmed against a running
                  # 2.1.5.5216 container: setting these two removes
                  # <ApiKey>/<AuthenticationMethod> from the generated
                  # config.xml entirely (the env value wins) and GET / /
                  # api/v1/system/status behave exactly as intended —
                  # External skips Prowlarr's own login prompt (no redirect
                  # to a form) while the API still demands X-Api-Key.
                  # Authelia's forwardAuth middleware (below) is what
                  # actually gates the host; this only stops Prowlarr from
                  # asking again behind it.
                  PROWLARR__AUTH__METHOD: External
                  PROWLARR__AUTH__APIKEY:
                    valueFrom:
                      secretKeyRef:
                        name: arr-api-keys
                        key: PROWLARR_API_KEY
                envFrom:
                  - configMapRef:
                      name: media-env
                probes:
                  liveness:
                    enabled: true
                    type: HTTP
                    # Confirmed unauthenticated on a running container even
                    # with AuthenticationRequired: Enabled — kubelet needs
                    # no credential to use this as the health check.
                    path: /ping
                    port: 9696
                  readiness:
                    enabled: true
                    type: HTTP
                    path: /ping
                    port: 9696
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: "1"
                    memory: 1Gi
                securityContext:
                  # capabilities.drop only exists at container level in the
                  # chart's schema (and in the Kubernetes API); the rest of
                  # the house 1000:1000 block lives in defaultPodOptions
                  # below. ghcr.io/home-operations images are built rootless
                  # — confirmed by actually starting this image as 1000:1000
                  # with every capability dropped; no per-app exception
                  # needed here.
                  capabilities:
                    drop: ["ALL"]
        defaultPodOptions:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        service:
          main:
            controller: main
            ports:
              http:
                port: 9696
        ingress:
          main:
            annotations:
              traefik.ingress.kubernetes.io/router.middlewares: authelia-forwardauth@kubernetescrd
            hosts:
              # prowlarr.tomkatom.com is a taken name: an unowned CNAME on
              # the still-production old server already answers for it, and
              # external-dns's ownership TXT records mean it can never adopt
              # or overwrite that CNAME even once --dry-run comes off (see
              # docs/runbooks/dns-cutover.md). This Ingress is inert for
              # public traffic until the cutover flips the record by hand;
              # nothing here changes external-dns's behavior.
              - host: prowlarr.tomkatom.com
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      identifier: main
                      port: http
        persistence:
          config:
            type: persistentVolumeClaim
            accessMode: ReadWriteOnce
            size: 1Gi
            globalMounts:
              - path: /config
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
