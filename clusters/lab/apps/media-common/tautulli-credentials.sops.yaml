# The two credentials Tautulli takes as environment variables, age-encrypted.
# Edit with `sops clusters/lab/apps/media-common/tautulli-credentials.sops.yaml`.
#
# ⚠ Both values must stay *quoted strings*. A Plex token is 20 alphanumeric
# characters and an API key is 32 hex, either of which can come out
# all-digits; typed unquoted into the sops editor that re-encrypts as
# `type:int`, and a number under `stringData` makes the whole Secret
# unappliable — see ./telegram.sops.yaml, where that happened for real. CI
# greps for it.
#
# `PLEX_TOKEN` is a Plex account token for the server Tautulli monitors, not
# an app-local key: it is what Tautulli signs its PMS requests with, and it
# grants whatever the account behind it can do. Read it off the running
# server rather than minting a new one — it is the `PlexOnlineToken`
# attribute in the Plex config PVC's `Preferences.xml`:
#
#   ssh k3s "sudo grep -o 'PlexOnlineToken=\"[^\"]*\"' \
#     /var/lib/rancher/k3s/storage/*_media_plex/Library/Application\ Support/\
#     Plex\ Media\ Server/Preferences.xml"
#
# Kept here rather than in a shared `plex` Secret because Tautulli is its
# only environment consumer: Seerr and Maintainerr each authenticate to Plex
# too, but both store that in their own database, so a shared key would have
# exactly one reader and two apps that merely look like readers.
#
# `TAUTULLI_API_KEY` pins Tautulli's own API key the way the *arrs' keys are
# pinned, and for the same reason — it survives the config PVC being lost
# (local-path reclaim is Delete) and it is what Maintainerr's Tautulli
# integration authenticates with. Any 32 hex characters will do:
# `openssl rand -hex 16`.
apiVersion: v1
kind: Secret
metadata:
    name: tautulli-credentials
    namespace: media
type: Opaque
stringData:
    PLEX_TOKEN: ENC[AES256_GCM,data:bFOWdu+Ku8eF4cB9OVi/lvtrbv0=,iv:dGhCWwzOTbGNk/ZE5jFdv1CH9aq1ZbiZy37bUROneak=,tag:kHKVuw0uvBu/JGgM1yieWA==,type:str]
    TAUTULLI_API_KEY: ENC[AES256_GCM,data:9hpY5od6OaLHI4CoMiiNbkqDCAJ60De1arLD2GNrNGw=,iv:cIsr2KTfdcd1I6r1qs4g0sgC5Nx0fElTwkr23eV4Ohk=,tag:UUPrwmE2dHRH9UqBpjPNdQ==,type:str]
