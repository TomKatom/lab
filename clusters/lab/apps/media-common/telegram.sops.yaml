# Real credentials, age-encrypted. Sourced per
# `docs/runbooks/media-migration.md` §2.5; rotate with
# `sops clusters/lab/apps/media-common/telegram.sops.yaml`.
#
# ⚠ Every value here must stay a *quoted string*. TELEGRAM_CHAT_ID is an
# all-digit negative group id: typed unquoted into the sops editor it
# re-encrypts as `type:int`, and a number under `stringData` makes the
# whole Secret unappliable — Argo fails the sync with "cannot unmarshal
# number into Go struct field Secret.stringData of type string" and this
# Secret simply never appears in the namespace, while every other resource
# in the overlay applies fine. That is exactly what happened on first fill
# (#54); CI now greps every clusters/**/*.sops.yaml for non-`type:str`
# values under stringData so it fails at PR time instead.
#
# Overseerr's "Media Available" agent and Tautulli's recently-added digest
# both post to this one group. Neither reads the Secret itself — both are
# configured in their own UI during runbook §9, and this is the single
# committed place the credential lives so a rotation has one home.
