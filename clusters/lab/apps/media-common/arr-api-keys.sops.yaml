# !! PLACEHOLDER CIPHERTEXT — DO NOT MERGE AS-IS !!
# All four encrypted values below are the literal string
# REPLACE_ME_BEFORE_MERGE, not real API keys. Read the old server's current
# keys per `docs/runbooks/media-migration.md` §2.2, then:
#   sops clusters/lab/apps/media-common/arr-api-keys.sops.yaml
# replace the four values, delete this comment block, commit. Keep each
# value quoted — an *arr key is 32 hex chars and can be all-digits, which
# unquoted YAML would parse as a number and stringData rejects.
#
# These are pinned to the old server's keys deliberately, never rotated:
# the databases restored in runbook §5-§7 already hold those keys in their
# own cross-references (Prowlarr's app-sync entries, Overseerr, Unpackerr),
# so reusing them makes the restore key-surgery-free.
#
# Consumed one key at a time via env.valueFrom.secretKeyRef, never envFrom —
# no app needs all four (see ../README.md "Secrets and environment"). The
# first three are also *inputs*, not just copies: Prowlarr/Sonarr/Radarr each
# set `<APP>__AUTH__APIKEY` from them, and that env var overrides whatever
# the restored config.xml holds. BAZARR_API_KEY has no equivalent override —
# Bazarr owns its key and can drift from this value (runbook §7).
