# Unpackerr — extracts archives (rar/zip/7z torrent releases usually ship
# compressed) in place under /data/torrents before Sonarr/Radarr import
# them. Fully declarative via UN_* env; no config file, no Service, no
# Ingress, no PVC. See ./README.md for the /data mount table and sync waves
# this file follows.
#
# It extracts beside the archive and leaves the archive alone, so the
# torrent keeps seeding intact and the *arr imports the extracted file.
# That only works while the paths below are the same directories the
# *arrs told Deluge to download into — see ./README.md "The /data path
# contract" for the single description of that chain.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unpackerr
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 5.0.1
    helm:
      valuesObject:
        controllers:
          app:
            containers:
              app:
                image:
                  repository: ghcr.io/unpackerr/unpackerr
                  # renovate: datasource=docker depName=ghcr.io/unpackerr/unpackerr
                  tag: "0.15.2"
                # Address and credential both come from media-common, so
                # this file states only what is specific to Unpackerr: which
                # apps it serves and where their downloads land.
                env:
                  UN_SONARR_0_URL:
                    valueFrom:
                      configMapKeyRef:
                        name: media-urls
                        key: SONARR_URL
                  UN_SONARR_0_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: arr-api-keys
                        key: SONARR_API_KEY
                  # The category directory each *arr downloads into, not
                  # the /data/torrents root above it. Unpackerr walks the
                  # path it is given looking for archives to extract, and
                  # the root also holds ~380 permanently seeding torrents
                  # in books/, games/, music/ and programs/ that no *arr
                  # imports — scanning those is work with no consumer, and
                  # an extracted 7z game repack sitting beside its torrent
                  # is a way to double the disk it uses. The two values
                  # mirror ./arr-settings/'s `downloadDirectory` and
                  # ./deluge.yaml's label paths; all three move together.
                  UN_SONARR_0_PATHS_0: /data/torrents/tv
                  UN_RADARR_0_URL:
                    valueFrom:
                      configMapKeyRef:
                        name: media-urls
                        key: RADARR_URL
                  UN_RADARR_0_API_KEY:
                    valueFrom:
                      secretKeyRef:
                        name: arr-api-keys
                        key: RADARR_API_KEY
                  UN_RADARR_0_PATHS_0: /data/torrents/movies
                envFrom:
                  - configMap: media-env
                securityContext:
                  capabilities:
                    drop: ["ALL"]
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  # Extraction is bursty (CPU spikes decompressing a large
                  # archive, otherwise idle polling the *arrs), so limits sit
                  # well above requests rather than 1:1 — headroom for a
                  # burst without letting one runaway extraction take the
                  # node.
                  limits:
                    cpu: 500m
                    memory: 256Mi
        defaultPodOptions:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        persistence:
          data:
            type: hostPath
            hostPath: /data
            hostPathType: Directory
            globalMounts:
              - path: /data
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
