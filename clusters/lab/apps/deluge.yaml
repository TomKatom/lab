# Deluge — the shared BitTorrent client every *arr points its download
# client at (`deluge.media.svc.cluster.local:8112`, Prowlarr/Sonarr/Radarr
# talk to it over the WebUI's JSON-RPC API, not a native protocol). See
# ./README.md for the mount table, sync waves, and the LSIO securityContext
# exception this file follows.
#
# Deluge's preferences are declared here rather than clicked in: the
# configMaps block at the bottom of this file holds /config/core.conf,
# /config/ltconfig.conf and the label definitions in /config/label.conf,
# and the init-config container below renders all three onto the /config
# PVC before deluged starts. app-template hashes every configMaps entry
# into a checksum/configMaps annotation on the pod template, so editing a
# value here rolls the pod on the next Argo sync all by itself — no
# Reloader is involved and none is installed.
#
# The labels are not decoration: a Deluge label name is one end of the
# path contract this stack runs on, and the *arr Category that names it is
# the other. Both ends are in git — this file, and ./arr-settings/ — and
# ./README.md "The /data path contract" holds the single description of
# how a grab becomes a Plex file. Change one end without the other and
# downloads stop being filed.
#
# That makes the reconcile loop explicit, and it is the one thing to
# understand before touching Deluge again: git wins at every daemon start,
# and the WebUI's Preferences page is a scratchpad whose edits survive only
# until the next restart. Deluge also rewrites both files at runtime with
# its full key set plus a .bak, so the on-disk copies are legitimately
# longer than the ones below and never diff clean against them — the
# omitted keys inherit Deluge 2.2.0 defaults by design.
#
# A second container joined this pod for metrics. It is a sidecar and not a
# Deployment of its own precisely because the credential it needs is a file on
# the /config PVC — see the `metrics` container below for why that decides
# both the topology and the securityContext. Note before writing any query
# against it: neither Deluge exporter in existence emits a `deluge_up`, and
# this one returns HTTP 200 with an empty body when the RPC connection fails,
# so Prometheus' own `up` stays 1 through a deluged outage.
# ../platform/monitoring/rules-media.yaml alerts on the absence of
# `deluge_info` instead.
#
# The in-app torrent listen port is part of that contract now: core.conf
# pins listen_ports [51413, 51413] with random_port: false, which is the
# in-app half of config/lab.yml's ports.torrent: 51413 (DNAT'd
# port-preserving from the public IP to the node). The two LoadBalancer
# Services below are the cluster half.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deluge
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 5.0.1
    helm:
      valuesObject:
        controllers:
          app:
            initContainers:
              # Renders the three declarative config files onto the /config
              # PVC and makes sure the pinned ltConfig egg is there, then
              # exits.
              #
              # It writes core.conf, ltconfig.conf, label.conf and the egg
              # and nothing else, deliberately. state/ (the session — one
              # .fastresume per torrent for the ~400 permaseeds), auth, and
              # web.conf (the pwd_sha1/pwd_salt the *arrs authenticate
              # against) are migrated state that only Deluge may touch.
              # Nothing here edits a file in place either:
              # state/*.fastresume is bencoded, and a length-prefixed
              # string does not survive a sed.
              #
              # Python rather than the busybox shell PR #63 used, for one
              # reason: label.conf cannot be copied, it has to be merged.
              # It carries torrent_labels — the per-torrent label
              # assignment for every seeding torrent — alongside the label
              # definitions this file owns, and a wholesale copy would wipe
              # it. init.py below does that merge with the real two-object
              # parser rather than a text hack; core.conf and ltconfig.conf
              # are still plain copies.
              init-config:
                image:
                  repository: docker.io/library/python
                  # renovate: datasource=docker depName=docker.io/library/python
                  tag: "3.14-alpine@sha256:26730869004e2b9c4b9ad09cab8625e81d256d1ce97e72df5520e806b1709f92"
                command: ["python3", "/config-src/init.py"]
                env:
                  # Unbuffered, so a crash-looping init container's last
                  # line is actually in `kubectl logs -c init-config`.
                  PYTHONUNBUFFERED: "1"
                # Unlike the deluge container below, this one has no s6 to
                # accommodate — it is a script writing files the daemon
                # then reads as PUID/PGID 1000, so it keeps the full house
                # securityContext and runs as 1000:1000 directly.
                securityContext:
                  runAsUser: 1000
                  runAsGroup: 1000
                  runAsNonRoot: true
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    memory: 64Mi
            containers:
              app:
                image:
                  repository: lscr.io/linuxserver/deluge
                  # renovate: datasource=docker depName=lscr.io/linuxserver/deluge
                  tag: "2.2.0-ls381"
                env:
                  # LSIO identity env — see the pod-level securityContext
                  # comment below for why this replaces, rather than
                  # complements, Kubernetes' own runAsUser enforcement.
                  PUID: "1000"
                  PGID: "1000"
                  UMASK: "002"
                envFrom:
                  - configMap: media-env
                probes:
                  liveness:
                    enabled: true
                    type: TCP
                    port: 8112
                  readiness:
                    enabled: true
                    type: TCP
                    port: 8112
                # Sized for the ~400 permanently-seeding torrents this
                # inherits from the old server, where the cost of getting it
                # wrong is asymmetric: an OOM kill means Deluge never writes
                # state/*.fastresume, and all 400 torrents force-recheck
                # against multi-TB of data on next start — hours of disk
                # thrash and zero seeding. Memory limit is deliberately well
                # above the ~1Gi of anonymous memory 400 torrents actually
                # need, because libtorrent 2.x's mmap disk I/O charges its
                # page cache to the cgroup: reclaimable, so not an OOM risk,
                # but it keeps a tight limit in permanent reclaim. Headroom
                # is free on a 128GB node.
                #
                # No CPU limit: seeding is not CPU-bound, and the one time
                # Deluge is (a mass recheck) is the one time throttling it
                # costs real waiting. Nothing else on this node needs
                # protecting from it — same as every platform component,
                # which set no limits at all.
                resources:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                  limits:
                    memory: 4Gi
              # Prometheus metrics for the session: torrents by state,
              # libtorrent throughput counters, and the live core config.
              #
              # A sidecar rather than its own Deployment, for two reasons that
              # are both about not duplicating state. It reads deluged's own
              # config directory for the RPC credentials — /config is a
              # globalMounts volume, so it is already mounted here at /config
              # with nothing to add — which means the localclient password
              # exists in exactly one place (the PVC) and never becomes a
              # second SOPS Secret to rotate in step. And that PVC is
              # ReadWriteOnce, so a second pod wanting the same directory would
              # be pinned to this node by the volume rather than by choice.
              # 127.0.0.1:58846 works from here because containers in a pod
              # share a network namespace — which is also why core.conf's
              # allow_remote can stay false.
              #
              # DELUGE_CONFIG_DIR selects that mode. The exporter uses env
              # credentials only when all four of DELUGE_HOST/PORT/USER/
              # PASSWORD are set; with fewer than four it parses core.conf for
              # daemon_port and the `auth` file for the localclient user and
              # password. DELUGE_HOST alone is therefore safe and is set for
              # legibility, not effect — 127.0.0.1 is already its default in
              # that branch.
              #
              # HOME is not decoration either. deluge_exporter.py:66 reads
              # `os.environ.get("DELUGE_CONFIG_DIR", get_deluge_config_dir())`
              # — Python evaluates that default eagerly, so Path.home() is
              # called on every start even though DELUGE_CONFIG_DIR is set, and
              # pathlib raises RuntimeError("Could not determine home
              # directory") when HOME is unset and the uid has no passwd entry.
              # runAsUser 1000 against a python:alpine image is exactly that
              # case. Setting HOME costs one line and removes the whole class.
              #
              # runAsUser 1000 is required, not stylistic: the image runs as
              # root by default (its config declares no user), and /config/auth
              # is mode 0600 owned by the uid deluged runs as, which the PUID
              # above pins to 1000. Root would also read it, but the pod-level
              # LSIO exception above means nothing else here forces non-root,
              # so this container carries the full house securityContext the
              # init container does.
              #
              # ⚠ The liveness probe is what makes a broken exporter visible,
              # and it is not optional. start_exporter() is wrapped in
              # loguru's @logger.catch, which logs and *swallows*: if the
              # config read fails, the exception never reaches the interpreter,
              # start_http_server is never called, and the process sits in its
              # `while True: sleep(60)` loop forever with nothing listening.
              # The container would stay Running and Ready, reporting no
              # metrics, indefinitely. A TCP probe on 9354 turns that into a
              # restart. There is deliberately NO readiness probe: readiness is
              # a pod-level property, so a failing one here would pull deluged
              # out of its own Service endpoints and break every *arr's
              # download client over a metrics problem.
              metrics:
                image:
                  repository: ghcr.io/tobbez/deluge_exporter
                  # renovate: datasource=docker depName=ghcr.io/tobbez/deluge_exporter
                  tag: "2.4.0@sha256:2aeab50aac50415da7c72fc934740329110988d011d9c592a00dd2eee2d87aa2"
                env:
                  DELUGE_CONFIG_DIR: /config
                  DELUGE_HOST: 127.0.0.1
                  HOME: /config
                  LISTEN_PORT: "9354"
                  # Default is ERROR, which hides the one line worth having:
                  # at INFO the exporter states which config directory, host
                  # and user it resolved, so a wrong mount is one `kubectl
                  # logs -c metrics` away instead of a silent empty scrape.
                  LOG_LEVEL: INFO
                  # Off, explicitly. Set to 1 this emits 17 metric families
                  # labelled by torrent name, hash and state — about 6,600
                  # series for this session's ~390 permaseeds, every one of
                  # them churning its `state` label. The default is already 0;
                  # stating it means an upstream default flip cannot quietly
                  # multiply this cluster's series count by an order of
                  # magnitude.
                  PER_TORRENT_METRICS: "0"
                securityContext:
                  runAsUser: 1000
                  runAsGroup: 1000
                  runAsNonRoot: true
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
                probes:
                  liveness:
                    enabled: true
                    type: TCP
                    port: 9354
                resources:
                  requests:
                    cpu: 10m
                    memory: 64Mi
                  limits:
                    memory: 128Mi
        # Documented exception (./README.md "Identity: everything runs as
        # 1000:1000"): the LSIO image boots as root via its own s6 init and
        # drops privilege internally to PUID/PGID above. No
        # runAsUser/runAsNonRoot — the container does not start as 1000, so
        # runAsNonRoot: true would fail admission outright — and no
        # container-level capabilities.drop either: s6 needs CAP_CHOWN,
        # CAP_SETUID, CAP_SETGID and CAP_DAC_OVERRIDE to chown /config and
        # /data and then su from root down to PUID/PGID, and dropping ALL
        # would break that internal step, not just harden it. The fsGroup/
        # seccompProfile fields below don't block a root start, so they're
        # kept; runAsUser/runAsGroup/runAsNonRoot and the container
        # securityContext are the only pieces the house block loses here.
        # The exception is scoped to that container: the init container
        # above keeps the full house block.
        defaultPodOptions:
          # Deluge writes one state/*.fastresume per torrent on SIGTERM;
          # ~400 of them do not finish inside the 30s default, and a SIGKILL
          # mid-write costs the same full recheck an OOM would. Every config
          # change and image bump rolls this pod, so a clean shutdown is a
          # routine event, not a rare one.
          terminationGracePeriodSeconds: 300
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        service:
          # Three Services, not one: klipper (k3s's bundled LB) can't share
          # one port across TCP and UDP on a mixed-protocol Service, so the
          # torrent port is split into two single-protocol LoadBalancers.
          # Dropping bt-udp is still the fallback if klipper ever refuses
          # it, but it is a real degradation to accept under duress rather
          # than the free swap this note used to describe: core.conf below
          # already disables DHT, and UDP/51413 also carries µTP — a large
          # share of live peer traffic — so losing it costs peers and
          # inbound connectability, not just DHT.
          app:
            # Pins the Service name to `deluge`. app-template appends the
            # identifier to every Service name as soon as an app declares
            # more than one (`_determineResourceNameFromValues.tpl`), so the
            # WebUI would otherwise be `deluge-app` purely because the
            # torrent port needed splitting — and it would silently rename
            # again if a Service were ever added or removed. The *arrs'
            # download-client host is config living in their DBs, not in
            # git, so a rename there is a manual re-point on every app;
            # DELUGE_URL in media-common/media-urls.yaml depends on this
            # name too.
            forceRename: deluge
            ports:
              http:
                port: 8112
              # The sidecar exporter's port, added to the existing Service
              # rather than given a fourth Service of its own. The exporter
              # runs in this pod, so a separate Service would carry the
              # identical selector and exist only to hold one more port —
              # another object to keep named correctly for no isolation in
              # return. The WebUI port stays first and unchanged; the
              # ServiceMonitor below selects this Service and scrapes the
              # metrics port by name, not by number.
              metrics:
                port: 9354
          bt-tcp:
            type: LoadBalancer
            ports:
              torrent:
                port: 51413
                protocol: TCP
          bt-udp:
            type: LoadBalancer
            ports:
              torrent:
                port: 51413
                protocol: UDP
        # Chart-rendered rather than a hand-written CR in the monitoring
        # overlay: app-template 5.0.1 ships templates/classes/_serviceMonitor.tpl
        # and resolves the Service name through the same helper that produced
        # the forceRename above, so the selector cannot drift from the Service
        # it selects. It emits selector `app.kubernetes.io/service: deluge`,
        # which is the label the renamed Service carries.
        #
        # It also leaves `jobLabel` at the chart default,
        # `app.kubernetes.io/name`, so these series land under `job="deluge"`.
        # ../platform/monitoring/rules-media.yaml deliberately does not match
        # on that — `deluge_torrents` and `deluge_info` are unambiguous names
        # and a job matcher would only be another thing to keep in step — but
        # it is what `up{job="deluge"}` and the target list will read. Only one
        # ServiceMonitor here, so its own name is `deluge` too.
        #
        # 1m interval: a scrape opens an RPC connection, pulls the whole
        # session status and every torrent's state, and disconnects. At ~390
        # torrents that is not free, and nothing downstream needs finer
        # resolution than a minute.
        serviceMonitor:
          app:
            service:
              identifier: app
            endpoints:
              - port: metrics
                path: /metrics
                interval: 1m
                scrapeTimeout: 30s
        ingress:
          app:
            annotations:
              traefik.ingress.kubernetes.io/router.middlewares: authelia-forwardauth@kubernetescrd
            hosts:
              - host: deluge.tomkatom.com
                paths:
                  - path: /
                    service:
                      identifier: app
                      port: 8112
        persistence:
          config:
            accessMode: ReadWriteOnce
            size: 2Gi
            globalMounts:
              - path: /config
          # The rendered ConfigMap, mounted read-only and — via
          # advancedMounts rather than globalMounts — into the init
          # container alone. deluged must never see /config-src: the
          # authoritative copies are the ones on the PVC, and a second,
          # read-only core.conf visible to the daemon is only a way to
          # confuse whoever debugs this next.
          config-src:
            type: configMap
            identifier: config
            advancedMounts:
              app:
                init-config:
                  - path: /config-src
                    readOnly: true
          # Broader than the old server, which bind-mounted only
          # /data/torrents into Deluge — keep the full /data tree anyway, to
          # match every sibling app's identical mount (see ./README.md
          # "The /data mount"); don't narrow this back to /data/torrents.
          #
          # advancedMounts, not globalMounts, for the same reason
          # config-src above uses them: the init container only ever writes
          # /config, so the whole media tree has no business being visible
          # to it. globalMounts would hand it the hostPath too.
          data:
            type: hostPath
            hostPath: /data
            hostPathType: Directory
            advancedMounts:
              app:
                app:
                  - path: /data
        configMaps:
          config:
            data:
              # Deluge config files are two concatenated JSON objects — a
              # version header, then the body — not one. A plain
              # single-object file does not load and Deluge silently falls
              # back to defaults, so keep the header on both files below.
              #
              # Only intentional values are declared; Config.load() does
              # `defaults.update(file_contents)`, so everything omitted
              # keeps its Deluge 2.2.0 default.
              #
              # The path values — download_location, move_completed_path,
              # torrentfiles_location, copy_torrent_file — were read back
              # off the live daemon and match production exactly, so this
              # file states the running contract rather than proposing one.
              #
              # download_location is the *fallback* only. Sonarr and Radarr
              # each pass an explicit per-category download directory when
              # they add a torrent (see ./arr-settings/,
              # `downloadDirectory`), so a grab lands in
              # /data/torrents/tv or /data/torrents/movies
              # and is never moved afterwards. Anything added by hand with
              # no label lands here at the root instead, and the labels in
              # label.conf below move it into place on completion.
              #
              # move_completed therefore stays false globally: the move is
              # a per-label concern, not a session-wide one, and a global
              # move would relocate every *arr grab a second time for no
              # reason. move_completed_path is pinned to the same value as
              # download_location so the pair is at least self-consistent
              # in git — but it is not a guard rail, and toggling
              # move_completed on in the WebUI is not a survivable edit:
              # it would drag every tv/movies grab up out of its category
              # directory into /data/torrents mid-import, and arm the
              # need_full_check branch this stack spends
              # docs/runbooks/deluge-arr-path-contract.md §3b disarming.
              #
              # max_active_seeding: -1 is the value that matters most here.
              # Deluge ships a desktop queue (5 seeding, 8 total), which
              # leaves 595 of 600 permaseeds Queued rather than Seeding.
              # Negative means unlimited; 0 would pause the whole session.
              # max_active_downloading deliberately stays bounded — it is
              # what stops a batch of *arr grabs from scattering writes
              # across the 2-disk HDD stripe.
              #
              # auto_managed: true is not cosmetic either: only
              # auto-managed torrents go on libtorrent's checking list, and
              # only that list is serialised to one recheck at a time. It
              # is the other half of terminationGracePeriodSeconds: 300
              # above.
              #
              # max_upload_speed is in KiB/s: 100000 is ~819 Mbit/s of the
              # 1 Gbit/s uplink, leaving headroom for Plex. It is the only
              # deliberate throttle; do not "fix" it to -1.
              #
              # max_connections_per_torrent is 200, not the 80 this stack
              # first shipped with. 80 was chosen to stop one large swarm
              # eating the global budget, but it binds far below that on a
              # real grab: a 144-seed swarm was measured pinned at 78
              # connections, i.e. capped, with ~66 seeds it never talked to.
              # The budget it was protecting is not actually scarce —
              # permaseeds hold almost no connections, because a seed only
              # connects to leechers and there are few (the whole 385-torrent
              # session sat at 6 connections while idle). 200 lets a race use
              # a full swarm and still leaves max_connections_global an order
              # of magnitude of headroom, even with max_active_downloading
              # torrents going at once.
              #
              # dht/lsd/utpex/upnp/natpmp off is private-tracker hygiene,
              # and allow_remote: false keeps the daemon protocol on
              # localhost — deluged and deluge-web share this container and
              # the *arrs come in over the WebUI's JSON-RPC.
              #
              # daemon_port is declared even though 58846 is already Deluge's
              # default, because the metrics sidecar reads it *out of this
              # file* rather than from deluged: with fewer than four DELUGE_*
              # env vars set, deluge_exporter.py parses core.conf for
              # daemon_port and then the auth file for credentials. The
              # init container rewrites core.conf from this block on every
              # start, so between that write and deluged's first save the
              # on-disk file is exactly what is declared here — omit the key
              # and the sidecar's startup KeyErrors through @logger.catch into
              # a silent no-listener state until the liveness probe restarts
              # it. Stating it makes that window deterministic instead of a
              # race.
              core.conf: |
                {
                  "file": 1,
                  "format": 1
                }{
                  "listen_ports": [51413, 51413],
                  "random_port": false,
                  "listen_interface": "",
                  "outgoing_interface": "",

                  "dht": false,
                  "lsd": false,
                  "utpex": false,
                  "upnp": false,
                  "natpmp": false,
                  "new_release_check": false,
                  "send_info": false,
                  "allow_remote": false,
                  "daemon_port": 58846,
                  "enc_in_policy": 1,
                  "enc_out_policy": 1,
                  "enc_level": 2,

                  "download_location": "/data/torrents",
                  "move_completed": false,
                  "move_completed_path": "/data/torrents",
                  "copy_torrent_file": true,
                  "del_copy_torrent_file": false,
                  "torrentfiles_location": "/data/torrents-final",
                  "pre_allocate_storage": false,
                  "prioritize_first_last_pieces": false,
                  "sequential_download": false,
                  "super_seeding": false,

                  "max_connections_global": 2500,
                  "max_connections_per_torrent": 200,
                  "max_upload_slots_global": -1,
                  "max_connections_per_second": 100,
                  "max_upload_speed": 100000,
                  "max_download_speed": -1,
                  "rate_limit_ip_overhead": true,

                  "auto_managed": true,
                  "max_active_seeding": -1,
                  "max_active_downloading": 5,
                  "max_active_limit": -1,
                  "dont_count_slow_torrents": true,
                  "queue_new_to_top": true,
                  "add_paused": false,
                  "stop_seed_at_ratio": false,
                  "remove_seed_at_ratio": false,

                  "enabled_plugins": ["Label", "ltConfig"]
                }
              # The libtorrent session settings Deluge exposes no preference
              # for. Core.apply_session_setting(s) is not @export-ed, so an
              # in-process plugin is the only way to reach them at all —
              # hence the ltConfig egg the init container fetches.
              #
              # apply_on_start is what makes the dict below apply at daemon
              # start instead of sitting inert.
              #
              # Every key here was checked to exist in the libtorrent this
              # image links (RC_2_0, via ghcr.io/by275/libtorrent:2). Do not
              # add one without checking it the same way:
              # _normalize_settings() deletes unknown keys while iterating
              # the dict, which raises RuntimeError on Python 3 and makes
              # the whole plugin fail to enable ("Unable to enable plugin"
              # in the pod log). The plugin's own WebUI page lists the live
              # key set and is the ground truth for that check.
              #
              # Keep this disjoint from core.conf. Deluge's
              # PreferencesManager pushes its own preferences into
              # libtorrent at start and on every preference change, so any
              # key set in both places flips back to the core.conf value.
              #
              # Bare ints are enums: seed_choking_algorithm 1 is
              # fastest_upload, mixed_mode_algorithm 0 is prefer_tcp,
              # suggest_mode 1 is suggest_read_cache. The disk values are
              # tuned for HDD behind virtiofs — file_pool_size and
              # piece_extent_affinity are the two that matter, and
              # hashing_threads is pinned at 1 on purpose (parallel hashing
              # on a 2-disk stripe turns a recheck into a seek storm).
              # Notably absent: cache_size/cache_expiry, which libtorrent
              # 2.x accepts and ignores — it has no disk cache any more.
              ltconfig.conf: |
                {
                  "file": 1,
                  "format": 1
                }{
                  "apply_on_start": true,
                  "settings": {
                    "file_pool_size": 500,
                    "aio_threads": 8,
                    "hashing_threads": 1,
                    "checking_mem_usage": 2048,
                    "max_queued_disk_bytes": 8388608,
                    "piece_extent_affinity": true,
                    "suggest_mode": 1,

                    "send_buffer_watermark": 3145728,
                    "send_buffer_watermark_factor": 150,
                    "send_buffer_low_watermark": 1048576,
                    "max_out_request_queue": 1500,
                    "max_peer_recv_buffer_size": 5242880,

                    "seed_choking_algorithm": 1,
                    "allowed_fast_set_size": 0,
                    "mixed_mode_algorithm": 0,
                    "listen_queue_size": 500,
                    "max_failcount": 1,
                    "active_tracker_limit": 2000,
                    "alert_queue_size": 10000
                  }
                }
              # The label definitions — the other half of the path
              # contract, and the half that used to exist only on the PVC.
              # A label name here is the same string as the Category field
              # in an *arr's Deluge client settings (./arr-settings/) and
              # the same string a human picks in the WebUI, so this list
              # and that one are edited together or not at all.
              #
              # Only `labels` is declared. The file Deluge actually keeps
              # also holds `torrent_labels`, the per-torrent assignment map
              # for every seeding torrent; init.py merges this block into
              # that file rather than copying over it, and it refuses to
              # drop a label that still has torrents attached — see the
              # merge rule there.
              #
              # apply_move_completed splits the labels in two, and the
              # split is the whole design:
              #
              #   tv, movies      — an *arr adds these, and it already
              #                     passes the final directory at add time,
              #                     so the torrent downloads in place and
              #                     the label must NOT move it afterwards.
              #                     A move here would relocate data the
              #                     *arr is mid-import on, which is exactly
              #                     the "import failed, retrying" race:
              #                     Deluge reports is_finished before
              #                     storage_moved_alert, so the *arr looks
              #                     for files at a path the move has
              #                     already emptied.
              #
              #   everything else — added by hand, with no client to pass a
              #                     directory, so they land at
              #                     download_location and the label is the
              #                     only thing that can file them. These
              #                     keep move-on-complete.
              #
              # apply_max and apply_queue stay false on every label. Both
              # are per-label overrides of the global tuning above:
              # apply_max re-caps connections and speeds, and apply_queue
              # carries is_auto_managed, which would take these torrents
              # off libtorrent's checking list and with it the
              # one-recheck-at-a-time serialisation that protects the HDD
              # stripe. stop_at_ratio stays false for the same reason
              # core.conf's stop_seed_at_ratio does — a paused seed is a
              # dead seed on a private tracker.
              label.conf: |
                {
                  "tv": {
                    "apply_move_completed": false,
                    "move_completed": false,
                    "move_completed_path": "/data/torrents/tv"
                  },
                  "movies": {
                    "apply_move_completed": false,
                    "move_completed": false,
                    "move_completed_path": "/data/torrents/movies"
                  },
                  "audiobooks": {
                    "apply_move_completed": true,
                    "move_completed": true,
                    "move_completed_path": "/data/torrents/books/audiobooks"
                  },
                  "ebooks": {
                    "apply_move_completed": true,
                    "move_completed": true,
                    "move_completed_path": "/data/torrents/books/ebooks"
                  },
                  "comics": {
                    "apply_move_completed": true,
                    "move_completed": true,
                    "move_completed_path": "/data/torrents/books/comics"
                  },
                  "games": {
                    "apply_move_completed": true,
                    "move_completed": true,
                    "move_completed_path": "/data/torrents/games"
                  },
                  "programs": {
                    "apply_move_completed": true,
                    "move_completed": true,
                    "move_completed_path": "/data/torrents/programs"
                  }
                }
              # The renderer. Runs as the init container above, from
              # /config-src, and is the only thing in this repo that writes
              # to Deluge's /config.
              #
              # Deluge config files are two concatenated JSON objects — a
              # version header, then the body — which is why this parses
              # with raw_decode in a loop rather than json.load, and why
              # the files it writes keep the same shape. label.conf above
              # is a plain single object because it is this script's input,
              # not a Deluge file; the two-object form is applied on write.
              init.py: |
                """Render Deluge's declarative config onto the /config PVC.

                Writes core.conf, ltconfig.conf, label.conf and the pinned
                ltConfig egg. Touches nothing else: state/, auth and
                web.conf are migrated state that only Deluge may write.
                """

                import hashlib
                import json
                import os
                import urllib.error
                import urllib.request
                from collections import Counter

                SRC = "/config-src"
                DST = "/config"
                HEADER = {"file": 1, "format": 1}

                EGG = "ltConfig-2.0.0.egg"
                EGG_URL = (
                    "https://github.com/ratanakvlun/deluge-ltconfig"
                    "/releases/download/v2.0.0/" + EGG
                )
                EGG_SHA256 = (
                    "c286427e0077c84b83b0ba88b964067e247c905eb1b94c0e982d382fa6f3ae09"
                )


                def read_deluge_conf(path):
                    """Return the body object of a two-object Deluge config file."""
                    with open(path, encoding="utf-8") as handle:
                        raw = handle.read()
                    decoder = json.JSONDecoder()
                    objects = []
                    index = 0
                    while index < len(raw):
                        while index < len(raw) and raw[index].isspace():
                            index += 1
                        if index >= len(raw):
                            break
                        obj, index = decoder.raw_decode(raw, index)
                        objects.append(obj)
                    return objects[-1] if objects else {}


                def write_text(path, text):
                    """Replace `path` atomically, never truncating it in place.

                    A half-written core.conf is worse than a stale one:
                    Deluge falls back to its desktop defaults (5 seeding
                    slots for ~400 permaseeds) and says so only at debug
                    level.
                    """
                    tmp = path + ".rendering"
                    with open(tmp, "w", encoding="utf-8") as handle:
                        handle.write(text)
                        handle.flush()
                        os.fsync(handle.fileno())
                    os.replace(tmp, path)


                def write_deluge_conf(path, body):
                    write_text(
                        path,
                        json.dumps(HEADER, indent=2)
                        + json.dumps(body, indent=2, sort_keys=True),
                    )


                def render_label_conf():
                    """Merge the declared labels into Deluge's live label.conf.

                    The live file owns torrent_labels (torrent id -> label
                    name) and must survive untouched. Git owns the label
                    definitions. A label that is no longer declared but
                    still has torrents attached is kept exactly as it is:
                    dropping it would orphan those torrents, and Deluge's
                    own clean_config() would then silently unlabel them.
                    """
                    dst = os.path.join(DST, "label.conf")

                    with open(os.path.join(SRC, "label.conf"), encoding="utf-8") as fh:
                        declared = json.load(fh)

                    live = read_deluge_conf(dst) if os.path.exists(dst) else {}
                    torrent_labels = live.get("torrent_labels", {})
                    live_labels = live.get("labels", {})

                    if os.path.exists(dst):
                        # torrent_labels is the one thing here that cannot be
                        # rebuilt from git, and this is the only writer that
                        # ever replaces the file holding it. Keep the copy it
                        # is about to replace, one restart deep.
                        with open(dst, "rb") as fh:
                            pre = fh.read()
                        with open(dst + ".pre-render", "wb") as fh:
                            fh.write(pre)

                    attached = Counter(torrent_labels.values())
                    labels = {}
                    for name in sorted(attached):
                        if name not in declared and name in live_labels:
                            print(
                                "label.conf: keeping undeclared label %r "
                                "(%d torrents still attached)"
                                % (name, attached[name])
                            )
                            labels[name] = live_labels[name]
                    labels.update(declared)

                    write_deluge_conf(
                        dst, {"torrent_labels": torrent_labels, "labels": labels}
                    )
                    print(
                        "label.conf: %d labels, %d torrent assignments preserved"
                        % (len(labels), len(torrent_labels))
                    )


                def ensure_egg():
                    """Fetch the pinned ltConfig egg unless it is already intact."""
                    plugins = os.path.join(DST, "plugins")
                    os.makedirs(plugins, exist_ok=True)
                    path = os.path.join(plugins, EGG)

                    if os.path.exists(path):
                        with open(path, "rb") as handle:
                            if hashlib.sha256(handle.read()).hexdigest() == EGG_SHA256:
                                print("ltConfig egg: present and intact")
                                return

                    print("ltConfig egg: fetching " + EGG_URL)
                    try:
                        with urllib.request.urlopen(EGG_URL, timeout=60) as response:
                            payload = response.read()
                    except (urllib.error.URLError, OSError) as error:
                        # Reaching github.com must never be what decides
                        # whether ~400 permaseeds come back up. ltConfig is
                        # tuning; deluged runs without it (logging "Unable
                        # to enable plugin"), so a fetch failure is loud and
                        # non-fatal rather than a crash-looping initContainer.
                        print("ltConfig egg: FETCH FAILED (%s) — starting "
                              "without the libtorrent tuning" % error)
                        return
                    digest = hashlib.sha256(payload).hexdigest()
                    if digest != EGG_SHA256:
                        # A mismatch is not a network blip; refuse to install.
                        raise SystemExit(
                            "ltConfig egg checksum mismatch: got %s, want %s"
                            % (digest, EGG_SHA256)
                        )

                    tmp = path + ".fetching"
                    with open(tmp, "wb") as handle:
                        handle.write(payload)
                    os.chmod(tmp, 0o644)
                    os.replace(tmp, path)
                    print("ltConfig egg: installed")


                for name in ("core.conf", "ltconfig.conf"):
                    with open(os.path.join(SRC, name), encoding="utf-8") as handle:
                        write_text(os.path.join(DST, name), handle.read())
                    print("%s: rendered" % name)

                render_label_conf()
                ensure_egg()
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
