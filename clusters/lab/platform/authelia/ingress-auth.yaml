# The portal itself — deliberately carries no forwardauth Middleware
# annotation. Putting Authelia behind its own forward-auth would be a
# lockout loop: the portal must always be reachable to authenticate against.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authelia
  namespace: authelia
spec:
  rules:
    - host: auth.tomkatom.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authelia
                port:
                  number: 9091
