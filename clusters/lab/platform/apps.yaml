# App-of-apps entrypoint for the media stack, mirroring root-app's own
# shape one layer down: root-app (../bootstrap/root-app.yaml) is already
# live and watches this directory (`platform/`) with `directory.recurse:
# false`, so this file lands and syncs with no operator re-apply. From
# here it does for `clusters/lab/apps` exactly what root-app does for
# `clusters/lab/platform` — apply only the top-level `apps/*.yaml`
# Application manifests, not the content of any subdirectory: each app's
# own non-Application content (a kustomize overlay, a ksops-encrypted
# Secret) lives in a same-named subdirectory (clusters/lab/apps/<component>/),
# discovered only by that component's own <component>-config.yaml
# kustomize-source Application — never by this Application scanning
# subdirectories.
#
# No `directory.recurse` field here, unlike root-app.yaml — non-recursive
# is already the default, and leaving it unset is deliberate, not an
# oversight. This Application (unlike root-app itself) IS a resource that
# root-app continuously diffs against git. Argo CD's `recurse` field has
# `omitempty` and gets dropped on persist even when set explicitly to
# `false`, so an explicit `recurse: false` here would make the live object
# permanently disagree with git and pin `apps` OutOfSync forever
# (upstream: argoproj/argo-cd#4501 — "the solution is to omit the field
# entirely when you don't wish to recurse"). root-app.yaml is exempt
# because nothing diffs it the same way: it's applied once by the Ansible
# bootstrap role, not synced as a child resource of another Application.
#
# Sync-wave 3, after every platform wave (0-2): the media apps assume
# Traefik/Authelia/cert-manager/external-dns already exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: git@github.com:TomKatom/lab.git
    targetRevision: master
    path: clusters/lab/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
