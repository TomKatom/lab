# Alert rules for the finance stack: one rule, watching the nightly moneyman
# CronJob that scrapes Bank Hapoalim and Isracard into Actual Budget. Actual
# itself gets nothing here on purpose — it is one container behind a
# Deployment on a PVC, and the chart's own KubePodCrashLooping,
# KubePodNotReady and KubePersistentVolumeFillingUp already say everything a
# hand-written rule could about that shape.
#
# Neither series below comes from anything the `finance` namespace runs.
# There is no exporter and no ServiceMonitor in that namespace; both come
# from kube-state-metrics. Verified at authoring time by rendering
# ../kube-prometheus-stack.yaml's own valuesObject at the pinned chart
# 88.1.4: kube-state-metrics v2.19.1, started with
# `--resources=…,cronjobs,…` and with no --metric-allowlist, no
# --metric-denylist, no --metric-labels-allowlist and no --namespaces
# restriction, behind a ServiceMonitor carrying `honorLabels: true` — which
# is the part that matters, because it is what stops the scrape target's own
# namespace="monitoring" from overwriting the metric's namespace="finance".
#
# READ ./rules-pve-host.yaml's HEADER FIRST for the two properties this file
# shares with every other rules file here and does not restate: there is no
# `release: kube-prometheus-stack` label, and there are no angle brackets in
# annotations.
#
# THE `unless` CARRIES AN EXPLICIT `on (namespace, cronjob)` AND THAT IS A
# DELIBERATE DEVIATION FROM THE PLAN, which drafted it bare. `unless` matches
# on the FULL label set of both sides, so a bare one is only correct while
# the two metrics agree on every label they carry. They do today: the
# kube-state-metrics v2.19.1 docs at that exact tag list
# `kube_cronjob_status_last_successful_time` and `kube_cronjob_spec_suspend`
# as STABLE with exactly `cronjob` and `namespace` and nothing else, and
# since both come off the same scrape target through a ServiceMonitor with no
# metricRelabelings they also share `job`, `instance`, `service`, `endpoint`,
# `pod` and `container`. That agreement is a coincidence of today's
# deployment rather than a property of the metrics, and losing it is silent:
# `promtool test rules` was run over both forms at authoring time, and with
# ONE extra label on the suspend series only (a `uid`, say) the bare form
# fires all night on a deliberately suspended CronJob while the `on (…)` form
# stays quiet. Both parse and both pass `promtool check rules`; only one is a
# fact about the CronJob's identity rather than about how kube-state-metrics
# happens to be labelled this week.
#
# THIS RULE IS DELIBERATELY SILENT IN TWO STATES AND NEITHER IS A BUG.
# Before the first-ever successful run, kube-state-metrics emits no
# `kube_cronjob_status_last_successful_time` at all (it publishes the series
# only once `.status.lastSuccessfulTime` is non-nil), so the left side is an
# empty vector and stays one. That is what makes this rule safe to merge
# ahead of the CronJob and safe to leave running through the operator
# bootstrap, when ../../apps/moneyman.yaml ships `suspend: true` and there
# has never been a success to be stale. The second state is suspension
# itself, which is what the `unless` is for: a CronJob suspended on purpose
# is not a CronJob that has stopped working.
#
# WHAT THIS ALERT CANNOT SEE, and the reason the description says so out
# loud. moneyman calls `process.exit(0)` unconditionally after `run()`, and
# both `run()` and `runScraper()` catch and merely log everything
# (src/index.ts:34, :60-63, :66-73 at release v2026.07.18.1 — the source was
# read at authoring time, the behaviour is not inferred from the README). A
# month of failed Isracard logins therefore produces a month of *Succeeded*
# Jobs, `kube_cronjob_status_last_successful_time` advances every night, and
# this rule never fires. So it detects a CronJob that has stopped RUNNING —
# a Pod that cannot pull or start, a run skipped because app-template 5.0.1
# injects `startingDeadlineSeconds: 30` whether asked for or not, or
# `concurrencyPolicy: Forbid` colliding with a still-running previous Job —
# and it does not detect a scrape that ran and came back with nothing. The
# plan's failure-mode table read this rule as the answer to "bank site
# changes break the scraper"; it is not, and the gap is written up in
# ../../../../docs/observability.md under "Deliberately not monitored"
# rather than papered over with a rule that would read as proof somebody
# checked. The honest cross-check is the one the runbook gives: transactions
# actually appearing in Actual.
#
# NO BESPOKE FAILED-JOB RULE, because two of the chart's own already cover
# that half and ../../../../docs/observability.md's "What the chart already
# covers" forbids restating them. Both are live in the rendered chart:
# `KubeJobFailed` (kube_job_failed > 0, for 15m, `namespace=~".*"`, so
# `finance` is in scope) and `KubeJobNotCompleted` (an active Job past 12 h,
# which ../../apps/moneyman.yaml's `activeDeadlineSeconds` keeps out of
# reach). Neither auto-resolves: `failedJobsHistory: 3` keeps the failed Job
# object around, so KubeJobFailed clears only when the operator deletes it or
# three newer failures rotate it out. MoneymanStale is the one in this pair
# that clears itself the moment a run succeeds, which is why it is worth
# having alongside them rather than instead of them.
#
# ../../apps/moneyman.yaml IS ADDED BY A SIBLING PR AND MAY NOT EXIST YET.
# Every reference to it above is forward-looking and this file is inert until
# it lands: with no CronJob there is no series, and an empty vector on the
# left of the `unless` is an empty result. That is the same absence that
# keeps the rule quiet before the first success, so there is nothing extra to
# do and no order the two PRs have to merge in.
#
# `cronjob="moneyman"` and `namespace="finance"` are hand-copied from that
# Application's release name and destination, and nothing checks the two
# agree — the same trap ./rules-pve-host.yaml records for its textfile
# metrics. Rename it and this rule keeps evaluating, keeps matching nothing,
# and reports no error of any kind.
#
# There is no homepage entry for any of this and moneyman's own Telegram
# notifier stays off. Alerting rides the existing
# Prometheus-Alertmanager-Telegram path that every other rule in this
# directory uses, so the bot token keeps exactly two SOPS homes
# (./alertmanager-config.sops.yaml and ../../apps/media-common/telegram.sops.yaml)
# instead of a third inside an encrypted blob nobody can diff.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: finance
  namespace: monitoring
  labels:
    app.kubernetes.io/name: finance
spec:
  groups:
    - name: finance
      rules:
        # 36 h, not 24 h, so a single missed or skipped night is not an
        # alert; and `for: 1h` on top of it means the first notification
        # lands about 37 h after the last success, by which time the run
        # after next has also been missed. Both are intentional - the thing
        # this watches runs once a day against two bank websites, and a
        # scrape that is a few hours late is not a fault worth waking
        # anyone for.
        - alert: MoneymanStale
          expr: |-
            (
              time() - kube_cronjob_status_last_successful_time{namespace="finance", cronjob="moneyman"} > 36 * 3600
            )
            unless on (namespace, cronjob)
            kube_cronjob_spec_suspend{namespace="finance", cronjob="moneyman"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: The nightly finance scrape has not completed a run in over 36 hours
            description: >-
              The moneyman CronJob in the finance namespace last recorded a
              successful run more than 36 hours ago and is not suspended, so
              at least the last two nightly runs either never started or
              never finished. Start with "kubectl -n finance get cronjob
              moneyman" and "kubectl -n finance get jobs,pods" - the usual
              causes are a Pod that cannot start and a run skipped because
              the previous one was still going. Note what this does NOT mean:
              moneyman exits 0 whether or not it managed to log in to the
              banks, so a broken scrape still records a successful run and
              this alert stays silent for it. The only way to know the data
              is current is to look at Actual. See
              docs/runbooks/finance.md.
