# The object ../loki.yaml's ruler has been waiting for. That Application
# mounts a ConfigMap named exactly `loki-rules` at /rules/fake with
# `optional: true`, so until this file merged the mount was an empty directory
# and the ruler evaluated nothing. The name and the namespace are the contract:
# rename either and the mount silently goes back to empty.
#
# `fake` is the tenant directory, not a placeholder — Loki's local rule store
# lays rules out as <directory>/<tenant>/<file>, and with auth_enabled: false
# every request is attributed to the synthetic tenant literally named `fake`.
# Each key in `data` below therefore becomes one rule *file* under that tenant.
# Two consequences worth stating, both from Loki's local store implementation
# (pkg/ruler/rulestore/local/local.go, loadAllRulesGroupsForUser):
#
#   - Every non-directory entry in the tenant directory is loaded as a rule
#     file, and a single unparseable one aborts the whole load with
#     "error parsing ..." — not just its own group. So this ConfigMap must
#     never grow a README key, a checksum, or anything else that is not a rule
#     file.
#   - The Kubernetes ConfigMap projection is symlink-based (`..data`, plus a
#     timestamped directory), and the store handles that correctly: it
#     os.Stat()s each symlink and skips the ones that resolve to directories.
#     That is why a ConfigMap mount works here at all.
#
# The file format is Prometheus-shaped and LogQL-valued. Loki's ruler runs the
# Prometheus rule manager, so `groups: -> rules: -> alert/expr/for/labels/
# annotations` is exactly the Prometheus alerting-rule schema, and only `expr`
# differs: it is LogQL, and it must be a *metric* query (count_over_time,
# rate, ...) reduced to a number, never a bare log selector. A log-stream
# expression is rejected at load time. Confirmed against the Loki 3.6.11 docs
# (docs/sources/alert/_index.md, "Alerting rule example" and "Ruler storage").
#
# ⚠ THE THRESHOLDS BELOW ARE GUESSES. Nothing in this repo has a week of log
# baseline to calibrate against, so 10 / 0 / 500 / 50 are starting points chosen
# to be quiet rather than correct. Each expression should be pasted into Grafana
# Explore against the Loki datasource and watched over real traffic before it
# is trusted; expect to move MediaAppErrorBurst in particular, since "error"
# means something different in every application in that namespace.
#
# The stream selectors are the part that fails silently rather than loudly. A
# LogQL selector naming a label nothing sets matches zero streams forever, with
# no error and no empty-result warning — the alert simply never fires. The
# label set available here is defined entirely by ../alloy.yaml's relabel
# rules, and is:
#
#   pod logs      namespace, pod, container, app
#                 (app from app.kubernetes.io/name, falling back to the legacy
#                 `app` pod label; there is NO `job` label on pod logs)
#   journal logs  job="systemd-journal", host="k3s-node"
#                 (no namespace, no pod — it is the node's own journal)
#
# So `{job="media"}` or `{namespace="systemd-journal"}` would both be valid
# LogQL and both match nothing. Every selector below is drawn from that list.
#
# KernelOOMKill is the reason the journal is collected at all. A process killed
# by the OOM killer leaves no trace in its own logs — it stops mid-line — and
# no metric records the event; the kernel ring buffer is the only witness. The
# filter is two stages rather than the one literal you would expect, because
# the kernel prints three different prefixes ahead of the same suffix
# (mm/oom_kill.c: "Out of memory", "Out of memory (oom_kill_allocating_task)"
# and "Memory cgroup out of memory", all followed by ": Killed process %d").
# A single |= "Out of memory: Killed process" therefore misses both the
# allocating-task form and — much more importantly here — every cgroup OOM
# kill, which is exactly how a container that exceeds its memory limit dies.
# The cheap literal runs first so the regex only sees the handful of lines that
# already contain "Killed process".
#
# It has no `for:` on purpose. An OOM kill is an event, not a state: by the
# time a five-minute `for` elapsed the count_over_time window would still hold
# it, but the notification would arrive five minutes after the process died
# for no benefit. The 10m window is what bounds how long the alert stays
# firing afterwards.
#
# PublicShareRequestSpike is the only rule here watching a hostname the whole
# internet can reach (clusters/lab/apps/filebrowser.yaml). It counts FileBrowser's
# own API request log, which goes to stdout by default and already excludes the
# noise that would otherwise dominate the count: FBQ's default `apiFilter` is
# `^/health|^/favicon.ico|^/static|^/public/static`, so the kubelet probes and
# every JavaScript and CSS fetch a share page makes are absent, and what is left
# is roughly one line per meaningful action. That is why the threshold can be a
# flat count rather than a rate — a legitimate recipient opening one link
# produces single digits.
#
# It is scoped to `{namespace="share"}` rather than added to
# MediaAppErrorBurst's selector below because that rule is hardcoded to
# `{namespace="media"}` and would never have seen this app.
#
# AutheliaAuthFailureSpike matches on the message text rather than a level,
# because Alloy ships raw lines with no parsing stage — there is no `level`
# label to select on. "Unsuccessful ... authentication attempt by user" is
# Authelia's wording for every failed factor (verified in Authelia 4.39.20,
# the appVersion of the pinned chart: handler_firstfactor_password.go:69 and
# response.go:492-496 all format "Unsuccessful %s authentication attempt by
# user '%s'", and nothing else in the source uses that phrase — there is no
# "Successful ... attempt by user" line to accidentally match). Matching the
# substring rather than the whole message also makes it independent of whether
# Authelia is logging text or JSON.
#
# One thing this rule is not: a lockout mechanism. Authelia's own regulation
# already bans an attacker after a handful of failures. This exists so a
# sustained attempt is visible in Telegram rather than only in a log nobody
# reads.
#
# TraefikMiddlewareMissing exists because on 2026-08-04 at 20:04:05 UTC a
# single configuration rebuild left all 28 routers referencing
# `authelia-forwardauth@kubernetescrd` or `traefik-ratelimit@kubernetescrd`
# logging `middleware "…" does not exist`. Traefik does not serve such a router
# with the middleware skipped — it drops the router entirely, so while that
# state holds every host behind Authelia answers 404 and the per-source rate
# limit in front of the public share hostname is gone with it. That is the
# front door being down rather than degraded, hence `severity: critical` where
# most of this file is warnings.
#
# The threshold is a bare `> 0` because a count carries no information here.
# Across the 30 days Loki retains, `{namespace="traefik"} |= "does not exist"`
# returns nothing but two such bursts — the 28 lines above and 32 more at
# 22:50:28 the same evening — each stamped within a single second, and no
# unrelated Traefik message in the window contains the phrase at all. The
# second burst is the informative one: it came from a freshly scheduled pod
# (a chart bump rolled the Deployment), which is what says this is a race
# while a full configuration is assembled from cold, recurring on restarts
# rather than a one-off. So the count is never the question — one occurrence
# is already abnormal, and the only question is whether it clears.
#
# The second filter, `|= "middleware"`, narrows nothing today. It is there so
# that if Traefik later logs some other `does not exist` (a missing service or
# TLS store, which want a different response) this rule keeps meaning what its
# name says.
#
# `for: 15m` is what separates the harmless case from the dangerous one, and it
# works only because it is LONGER than the range in the expression. A single
# burst makes count_over_time(...[10m]) non-zero for exactly the ten minutes the
# window takes to slide past it — five minutes short of the `for` — so a reload
# that self-heals on the next rebuild, which is what both 2026-08-04 bursts
# were, can never page. Firing requires a matching line at least every ten
# minutes for a continuous quarter hour: successive rebuilds that all still
# fail to resolve the middleware, i.e. the state has stuck. Widening the range
# to 15m or beyond, or shortening the `for`, would have paged twice in under
# three hours for two events that fixed themselves — so it is the range <
# `for` relationship that has to survive a retune, not the threshold.
#
# What this rule cannot see is a wedged config that has stopped being rebuilt.
# Traefik logs this at rebuild time, not per request, and its Kubernetes
# providers rebuild on watched-object changes rather than on a timer: the
# informers do resync every 10 minutes (pkg/provider/kubernetes/crd/client.go,
# `resyncPeriod = 10 * time.Minute`), but the shared event handler drops resync
# updates whose object did not actually change (pkg/provider/kubernetes/k8s/
# event_handler.go, OnUpdate → objChanged), so a resync on its own emits no
# event and re-logs nothing. This is a detector for an error that keeps
# recurring; silence from it is not by itself proof the routers came back.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki-rules
data:
  lab-logs.yaml: |
    groups:
      - name: lab-logs
        rules:
          - alert: AutheliaAuthFailureSpike
            expr: |
              sum by (namespace, pod) (
                count_over_time(
                  {namespace="authelia"}
                    |= "Unsuccessful"
                    |= "authentication attempt by user"
                  [15m]
                )
              ) > 10
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Burst of failed Authelia logins
              description: >-
                {{ $value }} unsuccessful authentication attempts were logged
                by {{ $labels.pod }} in the last 15 minutes. Authelia's own
                regulation bans repeat offenders, so this is a visibility
                signal rather than an action item — but a sustained rate means
                the login page is being worked on from outside.

          - alert: KernelOOMKill
            expr: |
              sum by (host) (
                count_over_time(
                  {job="systemd-journal"}
                    |= "Killed process"
                    |~ `(?i)out of memory`
                  [10m]
                )
              ) > 0
            labels:
              severity: critical
            annotations:
              summary: The kernel OOM-killed a process on {{ $labels.host }}
              description: >-
                {{ $value }} out-of-memory kills in the last 10 minutes. This
                covers both a host-wide OOM and a container exceeding its
                cgroup memory limit. Query
                '{job="systemd-journal"} |= "Killed process"' in Grafana
                Explore for the process name and its RSS at the time.

          - alert: PublicShareRequestSpike
            expr: |
              sum by (pod) (
                count_over_time(
                  {namespace="share"} |= "/public/" [15m]
                )
              ) > 500
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Unusual volume of public share requests
              description: >-
                {{ $value }} requests to /public were logged in the last 15
                minutes. Normal traffic is one recipient fetching one link, so
                a sustained rate means a share link has been reposted somewhere
                public, or the hostname is being scanned. Find the share in the
                FileBrowser UI on files.tomkatom.com and revoke it if the link
                has escaped; the per-share download cap should already have
                stopped the actual transfers.

          - alert: MediaAppErrorBurst
            expr: |
              sum by (app) (
                count_over_time(
                  {namespace="media"} |~ `(?i)\[\s*(error|fatal)\s*\]` [15m]
                )
              ) > 50
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Error burst in media app {{ $labels.app }}
              description: >-
                {{ $labels.app }} logged {{ $value }} error or fatal lines in
                the last 15 minutes. The bracketed level pattern matches the
                *arrs and Deluge; applications in this namespace that format
                levels differently are invisible to this rule, so treat it as
                a floor and not a guarantee.

          - alert: TraefikMiddlewareMissing
            expr: |
              sum by (namespace, pod) (
                count_over_time(
                  {namespace="traefik"}
                    |= "does not exist"
                    |= "middleware"
                  [10m]
                )
              ) > 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: Traefik is dropping routers with an unresolvable middleware
              description: >-
                {{ $labels.pod }} has been logging 'middleware ... does not
                exist' across successive config rebuilds for 15 minutes
                ({{ $value }} lines in the last 10). Traefik disables a router
                whose middleware chain will not resolve, so every host behind
                authelia-forwardauth answers 404 while this lasts, and
                traefik-ratelimit is off the routers that reference it. Check
                that the Middleware objects exist in the traefik and authelia
                namespaces, then make Traefik rebuild its configuration; every
                occurrence so far has been a provider race on a cold config
                build that cleared itself on the next rebuild. Query
                '{namespace="traefik"} |= "does not exist"' in Grafana Explore
                for the affected routers.
