# ksops generator: decrypts the SOPS files below into real Secrets at render
# time, inside the repo-server. Never a resource in its own right — kustomize
# consumes and drops it.
#
# ⚠ Every filename listed here must exist in git before this overlay can render
# at all. ksops has no `optional:` — a listed file that is missing is a hard
# `kustomize build` failure, which means the monitoring-config Application
# cannot sync *any* of its resources, not just the Secret. Both entries below
# are operator-created (see each file's committed `.example` template): adding a
# name here and merging before the encrypted file exists takes the whole overlay
# down until it does.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: monitoring-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - alertmanager-config.sops.yaml
  - pve-token.sops.yaml
