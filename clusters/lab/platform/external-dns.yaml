# external-dns — the chart half of the component (see README.md "Component
# layout"). Its only CR is the Cloudflare API token Secret, in the sibling
# external-dns-config.yaml → ./external-dns/.
#
# ⚠ DEPLOYED INERT. `--dry-run` below is the load-bearing line in this file,
# but not for the reason it looks like. It cannot stop external-dns taking a
# hostname from the old operational server, because nothing can: every name
# that server serves already has an explicit record, and an existing record
# it does not own is unreachable to it (see `policy` below). What dry-run
# guards is the one write that *is* unconditional — creating a name the zone
# does not have yet (`auth.`, `plex.` resolve to nothing today). Those creates
# now carry the right target — traefik.yaml's `ingressEndpoint.ip` publishes
# the public IP into every Ingress status, replacing the internal 10.10.10.10
# klipper would otherwise put there — so what is left to guard is the timing:
# a create makes a name resolve to the *new* server while the old one is still
# in production. The flag comes off as a deliberate step in
# docs/runbooks/dns-cutover.md, never as a drive-by edit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns
    chart: external-dns
    targetRevision: 1.21.1
    helm:
      valuesObject:
        provider:
          name: cloudflare
        env:
          # The Cloudflare provider reads its credential from the
          # environment, not from a config file — CF_API_TOKEN is the
          # scoped-token form (CF_API_KEY/CF_API_EMAIL is the legacy global
          # key, which this lab does not use). Secret decrypted by ksops
          # from ./external-dns/, one sync-wave earlier.
          - name: CF_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: cloudflare-api-token
                key: api-token
        sources:
          # Ingress only, narrowed from the chart default [service, ingress]
          # so external-dns has no way to publish a Service it was never
          # meant to — the rendered ClusterRole then grants `ingresses`
          # get/watch/list and nothing more. Note this buys nothing on the
          # *target*: Traefik copies an address into every Ingress status
          # either way, which is why traefik.yaml pins `ingressEndpoint.ip`.
          - ingress
        domainFilters:
          # Hard boundary on the one zone this instance may touch. Not
          # sourced from config/lab.yml's `domain` — Argo renders this
          # manifest straight from git with no templating layer in between.
          - tomkatom.com
        # `sync`, not the chart default `upsert-only`: a retired Ingress has
        # to take its record with it, or the zone accumulates orphans that
        # nothing in git accounts for and only a human can find.
        #
        # What keeps that safe on a zone shared with the old server is
        # ownership, not policy — and it is enforced at two layers, both
        # read in the v0.21.0 source rather than assumed:
        #
        #   1. plan.calculateChanges filters Delete/UpdateOld/UpdateNew
        #      through FilterEndpointsByOwnerID, and appendTakenDNSNameChanges
        #      drops a Create outright unless *every* record already at that
        #      name is owned by us (plan/plan.go).
        #   2. TXTRegistry.ApplyChanges re-filters Delete/UpdateOld/UpdateNew
        #      the same way (registry/txt/registry.go).
        #
        # An endpoint with no owner label fails both. The old server's records
        # and Tofu's manage_dns apex/vpn records carry no ownership TXT, so
        # `sync` cannot reach them — and neither can a create, which is why
        # external-dns cannot take over an existing hostname at all.
        #
        # The one unconditional write is a Create for a name with *no*
        # existing record. That is not an overwrite, but it is still a public
        # write, and it is what --dry-run is actually guarding. See the header.
        #
        # registry: txt is the chart default, restated because it is what
        # makes the above true and Renovate bumps this chart unattended.
        policy: sync
        registry: txt
        # Written into every ownership TXT record. The old server manages
        # records on this same zone by hand, so an owner ID this specific is
        # the difference between "external-dns adopts a record" and
        # "external-dns leaves someone else's record alone".
        txtOwnerId: lab-k3s
        # Keeps ownership TXTs off the record names themselves, so a TXT can
        # never collide with the record it tracks. Mind the record-type
        # infix when looking one up: the TXT for an A record at
        # auth.tomkatom.com is `_externaldns.a-auth.tomkatom.com`, and a
        # CNAME's would be `cname-`. AffixNameMapper.ToTXTName
        # (registry/mapper/mapper.go) prepends `<type>-` to the first label
        # unless the affix itself templates %{record_type}, which this one
        # does not.
        txtPrefix: _externaldns.
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
