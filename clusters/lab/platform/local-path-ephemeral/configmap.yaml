# The provisioner reads this by name (`--configmap-name` in deployment.yaml)
# from its own namespace, and re-reads it on change — the four keys are its
# entire runtime configuration.
#
# `nodePathMap` must point at the scsi2 mount that ansible/roles/k3s creates
# (k3s_ephemeral_mount_path). Those two values are the same path written in
# two layers and there is no mechanism forcing them to agree: point this at a
# path that is not a mount point and provisioning still succeeds, silently
# writing TSDB to the OS disk — where it is inside the VM backup again, which
# is the one thing this whole component exists to prevent. Change one, change
# the other.
#
# DEFAULT_PATH_FOR_NON_LISTED_NODES rather than a node name: this is a
# single-node cluster, and naming the node here would break provisioning on
# any rebuild that renames it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-ephemeral-config
data:
  config.json: |-
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": ["/var/lib/rancher/k3s/ephemeral"]
        }
      ]
    }
  # Verbatim from k3s's own local-storage.yaml, including the chmod: the
  # volume directory is world-writable so a container running as any uid can
  # use it, and its parent is then made 0700 so nothing unprivileged on the
  # node can traverse into other pods' volumes.
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "${VOL_DIR}"
    chmod 700 "${VOL_DIR}/.."
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "${VOL_DIR}"
  # The pod that runs the two scripts above on the node, once per volume
  # create/delete. It runs as root and mounts the host path — that is what it
  # is for, and why the ClusterRole's pod-creation half is a namespaced Role.
  # rancher/mirrored-library-busybox rather than docker.io/library/busybox is
  # the image k3s already pulled onto this node for its own provisioner, so a
  # volume can be provisioned with docker.io unreachable or rate-limiting.
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
      namespace: local-path-ephemeral
    spec:
      containers:
        - name: helper-pod
          # Renovate tracks this through the customManager in renovate.json
          # keyed on the comment below — the built-in kubernetes manager sees
          # only a ConfigMap string here, not a container spec.
          # renovate: datasource=docker depName=docker.io/rancher/mirrored-library-busybox
          image: "rancher/mirrored-library-busybox:1.37.0"
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
