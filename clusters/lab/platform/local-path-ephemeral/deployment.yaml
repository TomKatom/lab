# The provisioner itself. It never touches the host filesystem — it watches
# PVCs, writes PVs, and delegates every mkdir/rm to a helper pod — so it can
# run fully locked down. The securityContext below is upstream's own
# recommended set, shipped commented-out in the chart's values.yaml.
#
# `--provisioner-name` must match storageclass.yaml's `provisioner:` exactly;
# `--configmap-name` must match configmap.yaml's name. Both are matched as
# opaque strings with no validation on either side: get one wrong and the
# Deployment stays Ready while every PVC on this StorageClass sits Pending.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-ephemeral
  labels:
    app.kubernetes.io/name: local-path-ephemeral
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: local-path-ephemeral
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-path-ephemeral
    spec:
      serviceAccountName: local-path-ephemeral
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: local-path-provisioner
          # Pinned to the same version k3s bundles today, so the image is
          # already on the node and the two provisioners are the same binary.
          # Renovate keeps it current through its built-in `kubernetes`
          # manager (renovate.json scopes it to clusters/lab/**); the comment
          # below is documentation, matching every other pin in the repo, not
          # a second manager.
          # renovate: datasource=docker depName=docker.io/rancher/local-path-provisioner
          image: "rancher/local-path-provisioner:v0.0.36"
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - start
            - --config
            - /etc/config/config.json
            - --configmap-name
            - local-path-ephemeral-config
            - --service-account-name
            - local-path-ephemeral
            - --provisioner-name
            - cluster.local/local-path-ephemeral
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # Namespace it reads the ConfigMap from and creates helper pods in.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Where it reads the setup/teardown scripts back from, i.e. the
            # mount below. Not the same thing as --config, which names one
            # file in it.
            - name: CONFIG_MOUNT_PATH
              value: /etc/config/
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config-volume
          configMap:
            name: local-path-ephemeral-config
