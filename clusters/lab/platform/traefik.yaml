# Traefik — the chart half of the component (see README.md "Component
# layout"). Its CRs (the wildcard Certificate) live in the sibling
# traefik-config.yaml → ./traefik/.
#
# ServerSideApply, as everywhere else here: the chart ships 25 CRDs and the
# biggest (TraefikService, Middleware) are ~100kB of structural schema each —
# not over client-side apply's 262kB annotation ceiling the way cert-manager's
# are, but close enough that an upstream bump shouldn't be able to cross it.
# Fifteen of those CRDs are `hub.traefik.io` (Traefik Hub, a product this lab
# does not use); Helm has no way to install a subset, and Argo's skipCrds is
# all-or-nothing, so they come along inert.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.0.2
    helm:
      valuesObject:
        ports:
          web:
            expose:
              # Keep :80 off the Service, and therefore off the node: every
              # LoadBalancer port klipper sees becomes a hostPort, and only
              # :443 is DNAT'd from the public IP. HTTP→HTTPS redirection is
              # not this cluster's job — there is no reachable plaintext
              # port to redirect from.
              #
              # `ports.web: null` would drop the entrypoint outright and is
              # what the chart's own docs suggest, but Argo CD strips null
              # values out of valuesObject before Helm ever sees them
              # (argoproj/argo-cd#16312) — it renders correctly in CI and
              # silently does nothing live. This does not rely on nulls.
              # The container keeps an unexposed :8000 listener; nothing
              # routes to it.
              default: false
        service:
          spec:
            # The chart's own default, restated because it is load-bearing
            # and Renovate bumps this chart unattended: k3s ships klipper
            # servicelb (only `traefik` is in k3s_disable_components), which
            # answers a LoadBalancer Service by binding its ports on the
            # node — that is what puts Traefik behind the existing
            # :443 DNAT at 10.10.10.10.
            #
            # ⚠ Consequence worth knowing before writing any per-client rule:
            # klipper's forwarder MASQUERADEs unconditionally — its `entry`
            # script pairs every `-j DNAT` with a `-j MASQUERADE` on the way
            # out, with no externalTrafficPolicy branch. So Traefik sees the
            # svclb Pod's address as the source of *every* external request
            # and the real client IP never reaches this cluster. Nothing in
            # front sets `X-Forwarded-For` either, since Traefik is the edge.
            #
            # Any Traefik middleware keyed on the client — rateLimit,
            # ipAllowList, inFlightReq — therefore treats the whole internet
            # as one client, which turns a per-IP limit into a global one
            # that a single abuser can trip for everybody. Making those work
            # needs a real source of client IP first: either a proxy in
            # front whose header Traefik is configured to trust, or a load
            # balancer that preserves the source address (klipper cannot).
            # Until then, per-client rules belong in the app, not here.
            type: LoadBalancer
        ingressClass:
          # Also a chart default, restated for the same reason: Phase 6 app
          # Ingresses omit ingressClassName and rely on being defaulted here.
          isDefaultClass: true
        providers:
          kubernetesCRD:
            # Lets an Ingress/IngressRoute in any namespace reference a
            # Middleware in another — specifically Phase 6's *arr apps
            # pointing at authelia-forwardauth@kubernetescrd. Traefik v3
            # denies cross-namespace references by default.
            allowCrossNamespace: true
          kubernetesIngress:
            # What Traefik writes into every Ingress's
            # status.loadBalancer.ingress[].ip — and therefore the target
            # external-dns publishes, since the Ingress source reads the
            # target from exactly that field.
            #
            # Both settings are needed, and the order they are evaluated in
            # is the reason: Traefik's updateIngressStatus returns early on
            # publishedService and never looks at ip
            # (pkg/provider/kubernetes/ingress/kubernetes.go, v3.7.6), so
            # setting ip alone is silently a no-op. The chart defaults
            # publishedService.enabled to true, which points the status at
            # this chart's own LoadBalancer Service — whose address klipper
            # sets to the node's internal 10.10.10.10. Publishing that into
            # a public zone is the hazard external-dns's --dry-run currently
            # stands in for; this is the fix that lets the flag come off.
            #
            # The literal is the OVH host's single public IPv4 — the same
            # value as infra/tofu/terraform.tfvars' `ovh_public_ip` and
            # ansible/inventory/group_vars/all.yml, repeated because Argo
            # renders this manifest straight from git with no templating
            # layer that could reference either. If that IP ever changes,
            # `grep -rn` for it: this file is one of the places it hides,
            # and docs/runbooks/dns-cutover.md lists the rest.
            publishedService:
              enabled: false
            ingressEndpoint:
              ip: 145.239.3.55
        tlsStore:
          default:
            defaultCertificate:
              # Served for every host that doesn't request its own cert, so
              # a *.tomkatom.com Ingress needs no TLS block of its own. The
              # Secret is written by ./traefik/wildcard-certificate.yaml two
              # sync-waves later; until that first issuance completes
              # Traefik logs the missing Secret and falls back to its
              # built-in self-signed cert.
              secretName: wildcard-tomkatom-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
