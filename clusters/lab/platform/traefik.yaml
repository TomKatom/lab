# Traefik — the chart half of the component (see README.md "Component
# layout"). Its CRs (the wildcard Certificate) live in the sibling
# traefik-config.yaml → ./traefik/.
#
# ServerSideApply, as everywhere else here: the chart ships 25 CRDs and the
# biggest (TraefikService, Middleware) are ~100kB of structural schema each —
# not over client-side apply's 262kB annotation ceiling the way cert-manager's
# are, but close enough that an upstream bump shouldn't be able to cross it.
# Fifteen of those CRDs are `hub.traefik.io` (Traefik Hub, a product this lab
# does not use); Helm has no way to install a subset, and Argo's skipCrds is
# all-or-nothing, so they come along inert.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.1.1
    helm:
      valuesObject:
        ports:
          web:
            expose:
              # Keep :80 off the Service. It is also kept off the node by
              # omission — `hostPort` is unset here, and since the Service is
              # no longer a LoadBalancer (see `service.spec.type` below) a
              # hostPort is now the only thing that binds a node port at all.
              # HTTP→HTTPS redirection is not this cluster's job: there is no
              # reachable plaintext port to redirect from, and only :443 is
              # DNAT'd from the public IP.
              #
              # `ports.web: null` would drop the entrypoint outright and is
              # what the chart's own docs suggest, but Argo CD strips null
              # values out of valuesObject before Helm ever sees them
              # (argoproj/argo-cd#16312) — it renders correctly in CI and
              # silently does nothing live. This does not rely on nulls.
              # The container keeps an unexposed :8000 listener; nothing
              # routes to it.
              default: false
          websecure:
            # Bind :443 on the node from the Pod itself, replacing the
            # hostPort klipper used to open on this cluster's behalf. This is
            # what puts Traefik behind the existing :443 DNAT at 10.10.10.10
            # now that the Service is a plain ClusterIP.
            #
            # The point of the switch is the source address. The CNI portmap
            # plugin DNATs a hostPort to the Pod without masquerading traffic
            # that arrives from off-node, so Traefik finally sees the real
            # client IP — which klipper unconditionally overwrote (the long
            # note under `service.spec.type` below has the detail). That is
            # the prerequisite for any per-client middleware: rateLimit,
            # ipAllowList, inFlightReq.
            #
            # The container port stays the chart's 8443; `hostPort` and the
            # `exposedPort: 443` default are what make it :443 externally.
            hostPort: 443
            http:
              # Entrypoint middlewares apply to *every* router on :443 —
              # every Ingress in this cluster and every one added later, with
              # no per-app annotation. They also run ahead of a router's own
              # middlewares, so brute-force traffic is shed before it reaches
              # Authelia rather than after.
              #
              # The `traefik-` prefix is the CR's namespace: the
              # kubernetescrd provider names a Middleware
              # <namespace>-<name>@kubernetescrd. It is defined under
              # `extraObjects` at the bottom of this file, and the reason it
              # lives there rather than in the sibling ./traefik/ overlay is
              # written out at that key — it is a safety property, not a
              # style choice.
              middlewares:
                - traefik-ratelimit@kubernetescrd
        service:
          spec:
            # NOT the chart's default (LoadBalancer), and the difference is
            # load-bearing — Renovate bumps this chart unattended, so this is
            # the note that has to survive.
            #
            # k3s ships klipper servicelb (only `traefik` is in
            # k3s_disable_components), which answers a LoadBalancer Service
            # by binding its ports on the node via a per-Service DaemonSet.
            # That used to be what put Traefik behind the :443 DNAT — but
            # klipper's forwarder MASQUERADEs unconditionally: its `entry`
            # script pairs every `-j DNAT` with a `-j MASQUERADE` on the way
            # out, with no externalTrafficPolicy branch. Traefik therefore
            # saw the svclb Pod's address as the source of *every* external
            # request, and the real client IP never reached this cluster.
            # Nothing in front sets `X-Forwarded-For` either, since Traefik
            # is the edge.
            #
            # Consequences, both of which this cluster now needs to not have:
            # any middleware keyed on the client (rateLimit, ipAllowList,
            # inFlightReq) treated the whole internet as one client, so a
            # per-IP limit was really a global one a single abuser could trip
            # for everybody; and access logs carried no attacker address, so
            # a public unauthenticated endpoint had no forensic value at all.
            #
            # ClusterIP takes klipper out of the path entirely, and
            # `ports.websecure.hostPort` above opens :443 on the node
            # directly instead. Nothing in this repo dials this Service —
            # it is kept (rather than `service.enabled: false`) as the stable
            # in-cluster address and as a target for a future ServiceMonitor;
            # the chart renders none today.
            type: ClusterIP
        updateStrategy:
          rollingUpdate:
            # The chart defaults to maxUnavailable 0 / maxSurge 1, which
            # cannot work with a hostPort: the surged Pod would have to bind
            # :443 on a node where the outgoing Pod still holds it, so it
            # would sit Pending and the rollout would never complete.
            # Inverting the pair makes every Traefik rollout a brief outage
            # of :443 — seconds, and the honest cost of seeing client IPs on
            # a single-node cluster.
            maxUnavailable: 1
            maxSurge: 0
        ingressClass:
          # Also a chart default, restated for the same reason: Phase 6 app
          # Ingresses omit ingressClassName and rely on being defaulted here.
          isDefaultClass: true
        # Access logs, and only the ones worth keeping. Two questions made
        # this necessary at once: files.tomkatom.com is now reachable by the
        # whole internet with no request-level record anywhere in front of it
        # (../apps/filebrowser.yaml), and Authelia answers a 408 every minute
        # or two whose only clue is that the TCP peer is this pod — see the
        # `server.timeouts` note in ./authelia.yaml. Neither question can be
        # answered from a log Traefik does not write.
        #
        # `filters.statusCodes` is what keeps it affordable. Unfiltered, every
        # request through :443 becomes a Loki line — every Grafana poll, every
        # *arr API call, every Plex request — which is several times this
        # cluster's whole current log volume, for data nobody reads. 400-599
        # keeps what a scanner, a broken route or a rate-limited client
        # produces and drops the rest. The trade is real and deliberate: a
        # *successful* request to the public hostname leaves no trace here,
        # and stays visible only in the app's own log under
        # `{namespace="share"}`, which is what PublicShareRequestSpike
        # (./monitoring/loki-rules.yaml) already counts.
        #
        # JSON rather than the chart's default CLF because ./alloy.yaml ships
        # lines verbatim with no parsing stage — the structure has to survive
        # into Loki to be queryable at all. `{namespace="traefik"} | json |
        # __error__=""` then selects exactly the access log (Traefik's own app
        # log is logfmt and fails the parser, which is the filter), and
        # DownstreamStatus, RequestHost, RequestPath and ClientAddr become
        # real fields. Nothing in Alloy changes for this, and nothing keys on
        # Traefik log *text*, so the existing stream is unaffected.
        #
        # Two chart defaults are load-bearing and left alone rather than
        # restated, because both are already the safe direction:
        # `fields.headers.defaultMode: drop` is the line between an access log
        # and a credential leak — headers would put every Authelia session
        # cookie and every *arr API key into Loki — and `addInternals: false`
        # keeps Traefik's own ping/dashboard handlers out of the count.
        accessLog:
          enabled: true
          format: json
          filters:
            statusCodes: "400-599"
        providers:
          kubernetesCRD:
            # Lets an Ingress/IngressRoute in any namespace reference a
            # Middleware in another — specifically Phase 6's *arr apps
            # pointing at authelia-forwardauth@kubernetescrd. Traefik v3
            # denies cross-namespace references by default.
            allowCrossNamespace: true
          kubernetesIngress:
            # What Traefik writes into every Ingress's
            # status.loadBalancer.ingress[].ip — and therefore the target
            # external-dns publishes, since the Ingress source reads the
            # target from exactly that field.
            #
            # Both settings are needed, and the order they are evaluated in
            # is the reason: Traefik's updateIngressStatus returns early on
            # publishedService and never looks at ip
            # (pkg/provider/kubernetes/ingress/kubernetes.go, v3.7.6), so
            # setting ip alone is silently a no-op. The chart defaults
            # publishedService.enabled to true, which points the status at
            # this chart's own LoadBalancer Service — whose address klipper
            # sets to the node's internal 10.10.10.10. Publishing that into
            # a public zone is the hazard external-dns's --dry-run currently
            # stands in for; this is the fix that lets the flag come off.
            #
            # The literal is the OVH host's single public IPv4 — the same
            # value as infra/tofu/terraform.tfvars' `ovh_public_ip` and
            # ansible/inventory/group_vars/all.yml, repeated because Argo
            # renders this manifest straight from git with no templating
            # layer that could reference either. If that IP ever changes,
            # `grep -rn` for it: this file is one of the places it hides,
            # and docs/runbooks/dns-cutover.md lists the rest.
            publishedService:
              enabled: false
            ingressEndpoint:
              ip: 145.239.3.55
        tlsStore:
          default:
            defaultCertificate:
              # Served for every host that doesn't request its own cert, so
              # a *.tomkatom.com Ingress needs no TLS block of its own. The
              # Secret is written by ./traefik/wildcard-certificate.yaml two
              # sync-waves later; until that first issuance completes
              # Traefik logs the missing Secret and falls back to its
              # built-in self-signed cert.
              secretName: wildcard-tomkatom-tls
        # The one CR in this component that is deliberately NOT in the
        # sibling ./traefik/ overlay, against the three-piece convention
        # ../README.md documents. The reason is that an entrypoint
        # middleware reference is not a soft dependency:
        # BuildMiddlewareChain fails the whole router build with
        # `middleware %q does not exist`
        # (pkg/server/middleware/middlewares.go, v3.7.6), and a router that
        # fails to build serves 404. So a moment where the Deployment
        # carries the reference above and this object is absent is a moment
        # where *every* hostname in the lab is down — not the graceful
        # degradation the missing-cert case above gets.
        #
        # ./traefik/ is applied by traefik-config.yaml at sync-wave 2, two
        # waves after this chart, so putting it there would guarantee that
        # window on every bootstrap. Keeping it here makes the reference and
        # the referent one Argo Application and one sync, and — the part
        # that matters longer than the bootstrap — makes it impossible to
        # delete or rename this CR without editing the line that depends on
        # it.
        extraObjects:
          - apiVersion: traefik.io/v1alpha1
            kind: Middleware
            metadata:
              name: ratelimit
              namespace: traefik
            spec:
              rateLimit:
                # Token bucket per source: `average` per `period` is the
                # refill rate, `burst` the depth. No `sourceCriterion`, which
                # means the default — the request's remote address. That
                # default is only meaningful because `ports.websecure.hostPort`
                # above stopped klipper masquerading it; before that this
                # would have bucketed the entire internet as one client and
                # let a single abuser lock everybody out.
                #
                # Reading the remote address rather than X-Forwarded-For is
                # also what makes it unspoofable here: Traefik is the edge,
                # `forwardedHeaders.trustedIPs` is empty, so an inbound
                # X-Forwarded-For is overwritten, never trusted.
                #
                # Deliberately loose. The threat this answers is volumetric —
                # credential stuffing, scanners, a shared link being hammered
                # — and 100 r/s sustained from one address already makes all
                # of those impractical, while a slow, patient login attack is
                # Authelia's own regulation to handle (see
                # ./monitoring/loki-rules.yaml, AutheliaAuthFailureSpike).
                # The failure mode of guessing too low is self-inflicted 429s
                # on a heavy Grafana dashboard, discovered by something
                # breaking; burst 300 covers a hard refresh with room to
                # spare. Tighten once there is real traffic to calibrate
                # against.
                #
                # In-memory and per-instance, so the numbers only mean what
                # they say at one replica — which the `hostPort` above
                # already forces on a single-node cluster, since a second Pod
                # could not bind :443. Scaling out would need the `redis`
                # block to share counters.
                average: 100
                period: 1s
                burst: 300
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
