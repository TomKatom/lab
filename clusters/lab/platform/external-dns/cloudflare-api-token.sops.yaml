# The *same* Cloudflare API token already encrypted in
# ../cert-manager/cloudflare-api-token.sops.yaml (Zone:DNS:Edit +
# Zone:Read on tomkatom.com), re-encrypted here for the external-dns
# namespace — one token, two Secrets, because a Secret cannot be read
# across namespaces. Not a placeholder: this is the live credential.
#
# Rotating it means editing *both* files in the same commit, or
# cert-manager and external-dns end up authenticating with different
# tokens. `sops <file>` → paste the new value → save → commit, twice.
