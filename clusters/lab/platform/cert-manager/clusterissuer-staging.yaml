# Let's Encrypt *staging* — the default issuer for anything being iterated on.
# Its certs are untrusted by browsers, but it has its own rate-limit bucket,
# so a broken DNS-01 solver can be retried freely without spending the
# tomkatom.com prod quota that the still-live old server also draws from.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: tomcengich@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      # DNS-01 only: the lab issues a wildcard, which HTTP-01 cannot satisfy,
      # and public :443 still routes to the old server until cutover.
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
