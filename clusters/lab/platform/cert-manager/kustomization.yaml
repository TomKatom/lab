# Rendered by the ksops-patched Argo repo-server (Phase 4) — `kustomize build`
# here needs `--enable-alpha-plugins --enable-exec` plus the age key, which is
# why CI skips this directory (see ../README.md "Pre-merge review").
#
# No `namespace:` transformer on purpose: it would stamp a namespace onto the
# cluster-scoped ClusterIssuers too. Namespaced resources carry their own.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generators:
  - secret-generator.yaml

# The real *.tomkatom.com Certificate is not here — it lives in ../traefik/,
# because Traefik's default TLSStore can only read a Secret from its own
# namespace. A `smoke-staging` Certificate sat here until the prod issuance
# succeeded; it was removed once it had done its job (prune took the
# Certificate and its Secret with it). Re-add one the same way if the DNS-01
# path ever needs re-proving without spending prod rate limit.
resources:
  - clusterissuer-staging.yaml
  - clusterissuer-prod.yaml
