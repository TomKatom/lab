# The dedicated Cloudflare API token both ClusterIssuers authenticate
# with (Zone:DNS:Edit + Zone:Read on tomkatom.com). The same value is
# encrypted a second time in ../external-dns/cloudflare-api-token.sops.yaml
# for that namespace — a Secret cannot be read across namespaces, so
# rotating means editing both files in the same commit.
#
# This file carried a stale "PLACEHOLDER CIPHERTEXT — DO NOT MERGE AS-IS"
# header until now: the real token was sops-edited in before #44 merged,
# but SOPS only encrypts `stringData`, so the comment survived the
# round-trip untouched and outlived what it described.
