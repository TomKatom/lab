# cert-manager — the chart half of the component (see README.md "Component
# layout"). Its CRs (ClusterIssuers, Certificates) live in the sibling
# cert-manager-config.yaml → ./cert-manager/, one sync-wave later so the
# webhook is up and admitting before any Issuer is applied.
#
# ServerSideApply because the cert-manager CRDs carry structural schemas far
# past the 262kB last-applied-configuration annotation limit that client-side
# apply would try to write.
#
# The `prometheus.servicemonitor` block is what exposes
# certmanager_certificate_expiration_timestamp_seconds and
# certmanager_certificate_ready_status, which monitoring/rules-cluster.yaml
# alerts on. Three things about that key are easy to get wrong. It is
# lowercase `servicemonitor` — the chart's own values.yaml spells it that way,
# and `serviceMonitor` is accepted by Helm as an unrecognised value with no
# error while nothing is rendered. `podmonitor` is its mutually exclusive
# twin: enabling both is a hard chart error, so only one may ever be true
# here. And `prometheus.enabled` (true by default, hence not restated) gates
# the whole block — with it false the ServiceMonitor is skipped regardless.
#
# The ServiceMonitor lands in the cert-manager namespace, not monitoring, and
# is still picked up because kube-prometheus-stack.yaml's
# serviceMonitorNamespaceSelector renders as `{}` — an empty label selector,
# which in Kubernetes terms matches every namespace. No selector label is
# needed either: serviceMonitorSelector is `{}` too.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.1
    helm:
      valuesObject:
        # The modern key — `installCRDs` is deprecated and means the same as
        # enabled+keep. `keep: true` (chart default) leaves the CRDs behind if
        # the release is ever uninstalled, so an accidental prune of this
        # Application can't garbage-collect every Certificate in the cluster.
        crds:
          enabled: true
        prometheus:
          # Lowercase, and mutually exclusive with `podmonitor` — see header.
          servicemonitor:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
