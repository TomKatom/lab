---
# Shared, non-secret Ansible vars for every host. No role currently needs a
# secret; if one ever does, it would live in a sibling all.sops.yml (SOPS +
# age, decrypted in-memory by the community.sops vars plugin enabled in
# ../ansible.cfg — never written to disk). See ansible/README.md.
#
# Facts shared with OpenTofu/Helm live in ../../config/lab.yml instead of
# here, and are loaded per-playbook via `vars_files` (see docs/architecture.md
# #configuration-single-source-of-truth). This file only holds vars that are
# Ansible-only or, like ovh_public_ip below, needed before a playbook's
# vars_files load (see inventory/hosts.yml's top comment for why).

# Must match infra/tofu/terraform.tfvars `ovh_public_ip` — kept in sync by
# hand, same as that file's own duplication of the value inside
# `proxmox_endpoint`.
ovh_public_ip: 145.239.3.55

# Shared between roles/argocd and roles/argocd_secrets — both need the same
# namespace name, and argocd_secrets' tasks must run before argocd's helm
# install, so this can't live only in either role's own defaults/main.yml.
argocd_namespace: argocd

# Shared between roles/wireguard and playbooks/verify-wireguard.yml — a
# single name so neither has to redeclare it. It names the management
# tunnel specifically, which is the one verify-wireguard.yml asks for a
# handshake on; roles/wireguard reaches it through wireguard_instances
# below.
wireguard_interface: wg0

# The guest exit tunnel's interface. Shared three ways — roles/wireguard
# renders it, roles/network_nat matches its isolation rules on this exact
# name (playbooks/proxmox-host.yml passes it in), and
# playbooks/verify-wireguard.yml asserts both of those actually took — so it
# is a name here rather than a default in either role. Kept in its own
# variable rather than folded into wireguard_interface above: that one names
# the management tunnel specifically and several places rely on it meaning
# exactly that.
wireguard_exit_interface: wg1

# Shared between roles/network_nat, which renders this nftables table, and
# playbooks/verify-wireguard.yml, which reads it back to assert the exit
# tunnel's isolation rules are actually loaded. Same reasoning as
# wireguard_interface above — the verify playbook is the only automated test
# of that segmentation, and a name it had to redeclare would be a name that
# could drift out from under it. This is an override, not the definition:
# roles/network_nat still carries its own default, because a role that
# cannot render outside this one inventory is not a role.
network_nat_table: lab-nat

# Operator WireGuard peers: public key + the address that peer owns inside
# network.wireguard_subnet, never private key material (each peer generates
# and holds its own private key — see docs/ssh-keys.md's custody model for
# the same principle applied to SSH). Empty until an operator peer exists;
# roles/wireguard renders an interface with zero peers rather than failing
# when this list is empty.
#
# `address` is a single /32 and it is what the host renders as that peer's
# `AllowedIPs`. Server-side AllowedIPs is NOT the client's route list, even
# though both are spelled `AllowedIPs`: on the host it is cryptokey routing
# plus the anti-spoof source filter — the set of source addresses this peer
# is permitted to send from, and the only destinations the host will encrypt
# back to it. This file used to put the whole wireguard_subnet +
# internal_subnet here (a copy of the *client* side), which meant:
#   - the peer could forge a source inside internal_subnet, i.e. impersonate
#     a VM to firewall rules that authorize by source CIDR (the `+mgmt`
#     ipset, infra/tofu/firewall.tf), and
#   - a second peer was impossible: a prefix belongs to exactly one peer, so
#     whichever was configured last silently stole it from the first.
# Keep one /32 per peer, unique across this list, and inside the interface's
# own `subnet` — roles/wireguard asserts all three before rendering, the
# containment one because that `+mgmt` ipset authorises by source CIDR alone,
# so an address that strays into wireguard_subnet is an address that has
# management access whatever interface it was meant for.
#
# The client side is the mirror image and is deliberately not configured
# from here — a peer's own config routes wireguard_subnet + internal_subnet
# into the tunnel and leaves everything else on its local link (split
# tunnel). See docs/runbooks/wireguard-peer.md for the full client config.
#
# Add a peer once you've generated a keypair locally (`wg genkey | tee
# privatekey | wg pubkey > publickey` — keep privatekey off this repo
# entirely, it never needs to leave your machine):
#   wireguard_peers:
#     - name: my-laptop
#       public_key: "<contents of publickey>"
#       address: 10.10.20.3/32
# An optional per-peer PresharedKey is looked up by `name` from
# wireguard_peer_psks (group_vars/proxmox_host.sops.yml) — secret, so it
# never appears in this plaintext file.
wireguard_peers:
  - name: toms-macbook
    public_key: "nLi+BSIB6VIf99D1cLlIsbqZ3AU8jp+z2rp/n0LB/TQ="
    address: 10.10.20.2/32
  - name: toms-pc
    public_key: "AZ9c31nOcvfx01grp7AMnczZHoCDCqdcSnuWThgiPXw="
    address: 10.10.20.3/32

# Guest peers on the wg1 exit tunnel — a different kind of peer from
# wireguard_peers above, not more of them. These get the internet through
# the server's German IP and reach nothing in the lab.
#
# CLIENT SIDE (the half this file does not configure): a guest's own config
# takes `AllowedIPs = 0.0.0.0/0, ::/0` and `DNS = 1.1.1.1`. That is the
# opposite of the split tunnel wireguard_peers uses, and it is the point —
# a default route through the tunnel is what makes the guest's traffic
# appear to originate in Germany. `::/0` is not optional: without it a
# client on an IPv6-capable carrier keeps sending IPv6-capable destinations
# out over its own local address, which silently defeats the whole feature
# (config/lab.yml's network.wireguard_exit_subnet_v6 comment has the long
# version). A public resolver rather than a lab one, because a lab resolver
# would be an internal address these peers are firewalled away from — and
# 1.1.1.1's anycast POP and EDNS client subnet both read as German from
# here, which is what makes CDN-level geolocation follow the tunnel.
#
# SERVER SIDE (this file): unchanged from wireguard_peers' rule — `address`
# stays the peer's own single /32, and `address_v6` its own single /128.
# Server-side AllowedIPs is cryptokey routing plus the anti-spoof source
# filter, never the client's route list, so `0.0.0.0/0` here would let any
# guest forge a source inside internal_subnet and would make a second guest
# impossible (a prefix belongs to exactly one peer). roles/wireguard asserts
# both shapes, asserts that each sits inside wg1's own
# network.wireguard_exit_subnet / _subnet_v6 — a guest addressed into
# network.wireguard_subnet by a typo would otherwise be inside the `+mgmt`
# ipset, which matches by source CIDR alone and would hand it SSH and the
# PVE API on a path wg1's isolation rules never see — and asserts that no
# address or name is shared with wireguard_peers.
#
# `address_v6` pairs 1:1 with `address` — one peer, one v4 /32 and one v6
# /128 out of network.wireguard_exit_subnet_v6. The v6 address exists so
# the client can take `::/0`; the host forwards no IPv6 — roles/network_nat
# pins the sysctl and carries an ip6 drop pair for wg1 — so it is a
# blackhole by design and every connection falls back to IPv4.
#
# ISOLATION: these peers are firewalled out of the lab in the host's
# nftables forward chain (roles/network_nat), which allows exactly two
# things from wg1 — the internet, and connections that were DNAT'd to a
# published service — and drops everything else, including guest-to-guest.
# Nothing here grants access; adding a peer only issues a key.
#
# Empty: this repo ships wg1 with no guests. Adding one is
#   wireguard_exit_peers:
#     - name: a-guest
#       public_key: "<contents of their publickey>"
#       address: 10.10.30.2/32
#       address_v6: fd00:10:30::2/128
wireguard_exit_peers: []

# The interfaces roles/wireguard renders — one config file, one key pair
# and one wg-quick unit per entry: the management tunnel and the guest exit
# tunnel. The list exists so that a second interface is a data change
# rather than a rewrite of the role, and so every task in the role is
# already scoped to the instance it is working on instead of to an
# implicit single global (which is what made the old restart handler
# unsafe — see roles/wireguard/tasks/main.yml's last task).
#
# "Data change" was meant literally and held: wg1 needed a per-instance
# subnet to validate its peers against and an IPv6 leg on both the interface
# and its peers, and the role already carried both — so adding it is the
# entry below plus roles/network_nat, with no edit to the role that renders
# the only way into the box.
#
# wg0 keeps its `name` and `peers` by reference rather than inlining them:
# wireguard_interface and wireguard_peers are read under those names by
# playbooks/verify-wireguard.yml, and docs/runbooks/wireguard-peer.md tells
# the operator to add peers to wireguard_peers. wg1 does the same with
# wireguard_exit_interface, which roles/network_nat also keys its isolation
# rules on.
#
# `address`, `subnet` and `listen_port` name keys in config/lab.yml rather
# than repeating the values. They resolve lazily — Jinja in a group_vars
# value is evaluated where the value is used, by which point the playbook's
# vars_files has loaded config/lab.yml — which is exactly the laziness this
# file's header calls out ovh_public_ip as the one exception to.
#
# `subnet` is the CIDR every peer of this interface must sit inside, and
# roles/wireguard asserts that rather than deriving it from `address`: for
# wg0 it is the same config/lab.yml key infra/tofu/locals.tf builds the
# `+mgmt` ipset from, so the assert and the firewall cannot come to disagree
# about what "the management subnet" is — which is what stops a wg1 guest
# addressed into it by mistake from landing inside `+mgmt` and reaching SSH
# and the PVE API on the host's INPUT path, where wg1's forward-chain
# isolation never sees it. `address` is asserted to be inside `subnet` too,
# so the two keys can't drift apart either.
#
# `subnet_v6` and `address_v6` are the same pair one family up, optional per
# instance, and wg0 deliberately declares neither: the management tunnel has
# no IPv6 story and adding one would change a live interface's config, which
# restarts it, on a host whose only route in is that interface. An instance
# that omits them renders exactly the single-address config it rendered
# before dual-stack support existed, byte for byte.
wireguard_instances:
  - name: "{{ wireguard_interface }}"
    address: "{{ network.wireguard_host_address }}"
    subnet: "{{ network.wireguard_subnet }}"
    listen_port: "{{ ports.wireguard }}"
    peers: "{{ wireguard_peers }}"
  - name: "{{ wireguard_exit_interface }}"
    address: "{{ network.wireguard_exit_host_address }}"
    address_v6: "{{ network.wireguard_exit_host_address_v6 }}"
    subnet: "{{ network.wireguard_exit_subnet }}"
    subnet_v6: "{{ network.wireguard_exit_subnet_v6 }}"
    listen_port: "{{ ports.wireguard_exit }}"
    peers: "{{ wireguard_exit_peers }}"
