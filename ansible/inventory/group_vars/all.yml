---
# Shared, non-secret Ansible vars for every host. No role currently needs a
# secret; if one ever does, it would live in a sibling all.sops.yml (SOPS +
# age, decrypted in-memory by the community.sops vars plugin enabled in
# ../ansible.cfg — never written to disk). See ansible/README.md.
#
# Facts shared with OpenTofu/Helm live in ../../config/lab.yml instead of
# here, and are loaded per-playbook via `vars_files` (see docs/architecture.md
# #configuration-single-source-of-truth). This file only holds vars that are
# Ansible-only or, like ovh_public_ip below, needed before a playbook's
# vars_files load (see inventory/hosts.yml's top comment for why).

# Must match infra/tofu/terraform.tfvars `ovh_public_ip` — kept in sync by
# hand, same as that file's own duplication of the value inside
# `proxmox_endpoint`.
ovh_public_ip: 145.239.3.55

# Shared between roles/argocd and roles/argocd_secrets — both need the same
# namespace name, and argocd_secrets' tasks must run before argocd's helm
# install, so this can't live only in either role's own defaults/main.yml.
argocd_namespace: argocd

# Shared between roles/wireguard and playbooks/verify-wireguard.yml — a
# single name so neither has to redeclare it. It names the management
# tunnel specifically, which is the one verify-wireguard.yml asks for a
# handshake on; roles/wireguard reaches it through wireguard_instances
# below.
wireguard_interface: wg0

# Operator WireGuard peers: public key + the address that peer owns inside
# network.wireguard_subnet, never private key material (each peer generates
# and holds its own private key — see docs/ssh-keys.md's custody model for
# the same principle applied to SSH). Empty until an operator peer exists;
# roles/wireguard renders an interface with zero peers rather than failing
# when this list is empty.
#
# `address` is a single /32 and it is what the host renders as that peer's
# `AllowedIPs`. Server-side AllowedIPs is NOT the client's route list, even
# though both are spelled `AllowedIPs`: on the host it is cryptokey routing
# plus the anti-spoof source filter — the set of source addresses this peer
# is permitted to send from, and the only destinations the host will encrypt
# back to it. This file used to put the whole wireguard_subnet +
# internal_subnet here (a copy of the *client* side), which meant:
#   - the peer could forge a source inside internal_subnet, i.e. impersonate
#     a VM to firewall rules that authorize by source CIDR (the `+mgmt`
#     ipset, infra/tofu/firewall.tf), and
#   - a second peer was impossible: a prefix belongs to exactly one peer, so
#     whichever was configured last silently stole it from the first.
# Keep one /32 per peer, unique across this list, and inside the interface's
# own `subnet` — roles/wireguard asserts all three before rendering, the
# containment one because that `+mgmt` ipset authorises by source CIDR alone,
# so an address that strays into wireguard_subnet is an address that has
# management access whatever interface it was meant for.
#
# The client side is the mirror image and is deliberately not configured
# from here — a peer's own config routes wireguard_subnet + internal_subnet
# into the tunnel and leaves everything else on its local link (split
# tunnel). See docs/runbooks/wireguard-peer.md for the full client config.
#
# Add a peer once you've generated a keypair locally (`wg genkey | tee
# privatekey | wg pubkey > publickey` — keep privatekey off this repo
# entirely, it never needs to leave your machine):
#   wireguard_peers:
#     - name: my-laptop
#       public_key: "<contents of publickey>"
#       address: 10.10.20.3/32
# An optional per-peer PresharedKey is looked up by `name` from
# wireguard_peer_psks (group_vars/proxmox_host.sops.yml) — secret, so it
# never appears in this plaintext file.
wireguard_peers:
  - name: toms-macbook
    public_key: "nLi+BSIB6VIf99D1cLlIsbqZ3AU8jp+z2rp/n0LB/TQ="
    address: 10.10.20.2/32
  - name: toms-pc
    public_key: "AZ9c31nOcvfx01grp7AMnczZHoCDCqdcSnuWThgiPXw="
    address: 10.10.20.3/32

# The interfaces roles/wireguard renders — one config file, one key pair
# and one wg-quick unit per entry. Exactly one today, the management
# tunnel. The list exists so that a second interface is a data change
# rather than a rewrite of the role, and so every task in the role is
# already scoped to the instance it is working on instead of to an
# implicit single global (which is what made the old restart handler
# unsafe — see roles/wireguard/tasks/main.yml's last task).
#
# "Data change" is meant literally, so the role already carries the shape a
# second interface needs and does not yet use: its own subnet to validate
# peers against, and an optional IPv6 leg on both the interface and its
# peers. Those were built in here rather than left to the commit that adds
# the interface, because discovering mid-change that the role's peer assert
# cannot express the new interface's addresses is how a "just add data" step
# turns into reopening a role that renders the only way into the box.
#
# wg0 keeps its `name` and `peers` by reference rather than inlining them:
# wireguard_interface and wireguard_peers are read under those names by
# playbooks/verify-wireguard.yml, and docs/runbooks/wireguard-peer.md tells
# the operator to add peers to wireguard_peers. A future second interface
# is not the management tunnel and would declare its own name and peer list
# here directly.
#
# `address`, `subnet` and `listen_port` name keys in config/lab.yml rather
# than repeating the values. They resolve lazily — Jinja in a group_vars
# value is evaluated where the value is used, by which point the playbook's
# vars_files has loaded config/lab.yml — which is exactly the laziness this
# file's header calls out ovh_public_ip as the one exception to.
#
# `subnet` is the CIDR every peer of this interface must sit inside, and
# roles/wireguard asserts that rather than deriving it from `address`: it is
# the same config/lab.yml key infra/tofu/locals.tf builds the `+mgmt` ipset
# from, so the assert and the firewall cannot come to disagree about what
# "the management subnet" is. `address` is asserted to be inside it too, so
# the two keys can't drift apart either.
#
# An instance may also carry `subnet_v6` and `address_v6` for a dual-stack
# interface, and its peers a matching `address_v6`. Both are optional and wg0
# declares neither: the management tunnel has no IPv6 story, and adding one
# would change a live interface's config, which restarts it — on a host whose
# only route in is that interface. An instance that omits them renders
# exactly the single-address config it rendered before, byte for byte.
wireguard_instances:
  - name: "{{ wireguard_interface }}"
    address: "{{ network.wireguard_host_address }}"
    subnet: "{{ network.wireguard_subnet }}"
    listen_port: "{{ ports.wireguard }}"
    peers: "{{ wireguard_peers }}"
