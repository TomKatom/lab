---
# Dispatcher for the raw data disks Tofu attaches to this VM. The per-disk
# work — auto-detect, guard, mkfs, mount — lives in provision_disk.yml and is
# included once per entry of k3s_disks. Two things have to happen here rather
# than there, because both are properties of the *set* of disks:
#
# 1. The root device is resolved once and passed down. Every disk's
#    auto-detection excludes it, and every disk's final assert proves it is
#    not it.
# 2. The size windows are proven disjoint before any of them is used.
#    Auto-detection identifies a disk purely by "not the root disk, size in
#    window", and asserts it matched exactly one device. Two disks whose
#    windows overlap would each match two candidates and stop the play —
#    which is the safe outcome, but only by accident. This assert makes it
#    the stated contract, so a future resize (raising vm_data_disk_size_gb,
#    growing the ephemeral disk past 50 GB) fails here with a message that
#    names the problem instead of failing later with "found 2 candidates".

- name: Determine the device backing the root filesystem
  ansible.builtin.set_fact:
    k3s_root_disk: >-
      {{ (ansible_mounts | selectattr('mount', 'equalto', '/') | map(attribute='device') | first)
      | regex_replace('[0-9]+$', '') }}

- name: Reset the disk size-window overlap check
  ansible.builtin.set_fact:
    k3s_disk_window_overlaps: []

- name: Compare every k3s disk's size window against every other one's
  ansible.builtin.set_fact:
    k3s_disk_window_overlaps: >-
      {{ k3s_disk_window_overlaps + [item.0.name ~ ' / ' ~ item.1.name] }}
  loop: "{{ k3s_disks | product(k3s_disks) | list }}"
  loop_control:
    label: "{{ item.0.name }} vs {{ item.1.name }}"
  when:
    - item.0.name != item.1.name
    - (item.0.min_size_gb | float) <= (item.1.max_size_gb | float)
    - (item.1.min_size_gb | float) <= (item.0.max_size_gb | float)

- name: Assert no two k3s disks share an auto-detection size window
  ansible.builtin.assert:
    that:
      - k3s_disk_window_overlaps | length == 0
    fail_msg: >-
      These k3s disk size windows overlap:
      {{ k3s_disk_window_overlaps | unique | join(', ') }}. Auto-detection
      identifies each disk by size alone, so overlapping windows make it
      ambiguous which physical device is which — and this role mkfs's what
      it detects. Widen the gap between the windows (and the Tofu disk sizes
      behind them) before converging.
    success_msg: >-
      The {{ k3s_disks | length }} k3s disk size windows are disjoint
      ({{ k3s_disks | map(attribute='name') | join(', ') }}).

- name: Format and mount each k3s data disk
  ansible.builtin.include_tasks: provision_disk.yml
  loop: "{{ k3s_disks }}"
  loop_control:
    loop_var: k3s_disk
    label: "{{ k3s_disk.name }} ({{ k3s_disk.mount_path }})"
