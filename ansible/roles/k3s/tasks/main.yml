---
# Dispatcher: storage must be mounted and config.yaml must exist before k3s's
# first start, so import order matters here. Formatting/mounting the data
# disks first means local-path-provisioner's default storage dir already
# resolves to scsi1 instead of the OS disk when k3s starts — and, for scsi2,
# that the local-path-ephemeral provisioner Argo installs later finds a real
# filesystem under its nodePathMap rather than a directory on the OS disk it
# would then have to be migrated off. Writing config.yaml before
# install.yml's first `k3s` start means k3s reads "disable: [traefik]" on its
# very first boot and never installs the Traefik helm chart at all — there is
# no "uninstall Traefik afterwards" step. kubeconfig.yml runs last because it
# depends on k3s already being up.

- name: Format and mount the scsi1 and scsi2 data disks
  ansible.builtin.import_tasks: disk.yml

- name: Install and start k3s
  ansible.builtin.import_tasks: install.yml

- name: Fetch the kubeconfig for local use
  ansible.builtin.import_tasks: kubeconfig.yml
