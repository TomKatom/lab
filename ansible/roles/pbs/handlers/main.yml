---
- name: Reload lab-host-backup
  # Unit files changed on disk: daemon_reload picks them up, and restarting the
  # timer re-arms it against the new schedule. Restarting a *timer* does not run
  # its service — and with Persistent= and no missed run to catch up on, systemd
  # simply waits for the next OnCalendar. Changing the schedule therefore never
  # costs an unplanned upload.
  ansible.builtin.systemd:
    name: "{{ pbs_host_backup_name }}.timer"
    daemon_reload: true
    state: restarted

- name: Reload lab-backup-metrics
  # Same as above, for the telemetry collector's units. Restarting a timer
  # does not run its service; the collector's own "run once now" task in
  # tasks/metrics.yml is what refreshes the numbers on a converge.
  ansible.builtin.systemd:
    name: "{{ pbs_metrics_name }}.timer"
    daemon_reload: true
    state: restarted

- name: Refresh lab-backup-metrics
  # Script changed: run the oneshot rather than serving numbers produced by
  # the previous version of it for up to pbs_metrics_interval. Unlike
  # lab-host-backup, which this role deliberately gives no handler, running
  # this costs four local API calls and uploads nothing.
  ansible.builtin.systemd:
    name: "{{ pbs_metrics_name }}.service"
    state: restarted
