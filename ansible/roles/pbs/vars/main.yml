---
# Derived command-line fragments. In vars/ rather than defaults/ on purpose:
# these are assembled from defaults/main.yml plus the SOPS-held credentials
# and are not tuning knobs — role vars outrank inventory, so nothing can
# override half of a command string from a group_vars file.
#
# They live here rather than inline in tasks/ because each one is used by a
# create task *and* an update task that have to stay byte-identical. Written
# out twice, they drift, and the failure is invisible: the object is created
# correctly and then quietly reconciled to something slightly different.
#
# `| quote` throughout, not hand-written double quotes: the command module
# splits with shlex (no shell involved), so this is what carries values
# containing spaces — every calendar event here has one.

pbs_s3_endpoint_args: >-
  --endpoint {{ pbs_s3_endpoint_url | quote }}
  --region {{ pbs_s3_region | quote }}
  --access-key {{ pbs_s3_access_key | quote }}
  --secret-key {{ pbs_s3_secret_key | quote }}
  --path-style {{ pbs_s3_path_style | bool | lower }}
  {{ ('--provider-quirks ' + pbs_s3_provider_quirks) if pbs_s3_provider_quirks else '' }}

pbs_prune_job_args: >-
  --schedule {{ pbs_prune_schedule | quote }}
  {% for option, value in pbs_prune_keep.items() %}--{{ option }} {{ value }} {% endfor %}

pbs_verify_job_args: >-
  --schedule {{ pbs_verify_schedule | quote }}
  --ignore-verified true
  --outdated-after {{ pbs_verify_outdated_after }}

# proxmox-backup-client's repository form is
# [[username@]server[:port]:]datastore, so a realm-qualified auth-id brings
# its own @ and the result legitimately carries two of them:
# pve-backup@pbs@127.0.0.1:8007:lab. Assembled from the same four values
# tasks/pve_storage.yml builds the `pvesm add` call from, so the two clients
# of this datastore cannot drift into naming different things.
pbs_host_backup_repository: "{{ pbs_pve_user }}@{{ pbs_pve_storage_server }}:{{ ports.pbs_api }}:{{ pbs_datastore }}"

# Telegram's Bot API, driven entirely from the query string: no JSON body and
# no headers, so nothing here depends on how PBS base64-encodes a body or on
# getting JSON escaping right inside a handlebars template. `url-encode` is
# PBS's own helper and the braces are PBS's templating, not Ansible's —
# {% raw %} is what keeps them intact through this file.
#
# Known limitation, worth stating because it bites silently: Telegram caps
# `text` at 4096 characters and rejects the whole request above that. A long
# PBS report (a verify job listing many snapshots) can be dropped for that
# reason alone. That is acceptable for a last-resort channel whose job is to
# say "go and look", but it is why this is a supplement to Alertmanager and
# not a replacement for it.
pbs_notify_webhook_args: >-
  --method post
  --url {% raw %}'https://api.telegram.org/bot{{ secrets.token }}/sendMessage?chat_id={{ secrets.chatid }}&text={{ url-encode title }}%0A%0A{{ url-encode message }}'{% endraw %}
  --secret name=token,value={{ pbs_notify_telegram_bot_token | b64encode }}
  --secret name=chatid,value={{ pbs_notify_telegram_chat_id | string | b64encode }}
  --comment {{ 'Backup failures to Telegram - survives the k3s VM being down' | quote }}
