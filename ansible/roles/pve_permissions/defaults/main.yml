---
# Role-private vars, prefixed pve_permissions_* so they can't collide with
# another role's defaults.
pve_permissions_terraform_role: Terraform
pve_permissions_terraform_user: terraform@pve
# Token id infra/tofu authenticates with (proxmox_api_token is
# "terraform@pve!<tokenid>=<uuid>" in secrets.sops.tfvars.json). The PVE API
# reveals a token's secret exactly once, at creation, so this role never
# creates it — that's scripts/mint-pve-token.sh, run once by the operator
# (see tasks/main.yml for why CI must not mint it).
pve_permissions_terraform_token: tofu

# Base privileges the bpg/proxmox provider needs for everything infra/tofu
# manages: VM lifecycle + cloud-init, cloud-image download into a datastore,
# the vmbr1 bridge and PVE firewall (both via Sys.Modify), and the virtiofs
# directory mapping (Mapping.*). Mirrors the provider's documented role
# recommendation plus the Mapping.* set storage-virtiofs.tf needs. Grants
# are append-only: this role only ever adds privileges, never revokes —
# narrowing the role is an operator decision, not a converge side effect.
pve_permissions_role_privs:
  - Datastore.Allocate
  - Datastore.AllocateSpace
  - Datastore.AllocateTemplate
  - Datastore.Audit
  - Mapping.Audit
  - Mapping.Modify
  - Mapping.Use
  - Pool.Allocate
  - SDN.Use
  - Sys.Audit
  - Sys.Console
  - Sys.Modify
  - User.Modify
  - VM.Allocate
  - VM.Audit
  - VM.Clone
  - VM.Config.CDROM
  - VM.Config.Cloudinit
  - VM.Config.CPU
  - VM.Config.Disk
  - VM.Config.HWType
  - VM.Config.Memory
  - VM.Config.Network
  - VM.Config.Options
  - VM.Migrate
  - VM.PowerMgmt

# Granted separately from the base list, and only once every running guest's
# qemu-guest-agent actually responds — see tasks/main.yml.
# VM.GuestAgent.Unrestricted is deliberately never granted (read-only agent
# access is all Tofu needs).
pve_permissions_agent_privs:
  - VM.GuestAgent.Audit

# The read-only half: prometheus-pve-exporter (clusters/lab/platform/monitoring)
# polls the PVE API as this user for /cluster/status, /cluster/resources and the
# per-node config/replication endpoints.
#
# PVEAuditor is a PVE *built-in* role, so unlike the Terraform role above there
# is no privilege list here to create, append to or keep in sync — and that is
# the point, not a shortcut. Its privilege set is Audit-only by construction, so
# a credential that leaks out of the cluster cannot start, stop, reconfigure or
# delete anything, and no future edit to this file can quietly widen it the way
# adding one line to pve_permissions_role_privs would. Defining a custom
# read-only role instead would buy nothing and would need maintaining against
# every PVE release that adds an Audit privilege.
pve_permissions_monitoring_user: monitoring@pve
pve_permissions_monitoring_role: PVEAuditor
# Token id the exporter authenticates with (PVE_TOKEN_NAME in
# pve-exporter-deployment.yaml; the secret half is PVE_TOKEN_VALUE, delivered
# from clusters/lab/platform/monitoring/pve-token.sops.yaml). Same single-reveal
# problem as the tofu token above — the API shows a token's secret exactly once,
# at creation — so this role never creates it either. That is
# scripts/mint-pve-monitoring-token.sh, run once by the operator.
pve_permissions_monitoring_token: prometheus
